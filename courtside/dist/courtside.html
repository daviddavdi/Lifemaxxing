  const cdev = S.coach.a.dev;
  for (const p of Object.values(S.players)) {
    ensureTraits(p);
    logStint(p);
    p.age++;
    let g = seasonGrowth(p);
    const mine = p.team === S.userTeam;
    if (mine && g > 0) g *= 0.8 + cdev / 50;
    if (mine && S.training === 'youth') g += p.age <= 23 ? 0.25 : -0.15;
    growPlayer(p, g * ATTRS.length, mine ? S.training : 'balanced');
    const nca = calcCA(p);
    if (nca > p.pot) p.pot = Math.round(nca * 10) / 10;
    const over = p.age - p.peak;
    const retireP = p.age >= 35 ? 0.3 + (p.age - 35) * 0.2 + Math.max(0, over - 5) * 0.05 : over >= 3 ? (nca < 9 ? 0.25 : 0.04) : (p.age >= 29 && nca < 6.5 && p.team == null ? 0.3 : 0);
    if (R.chance(retireP)) retirees.push(p);
  }
  for (const p of retirees) { handleRetirement(p); delete S.players[p.id]; }
  staffNewSeason();
  prunePlayerRivals();
  for (const p of Object.values(S.players)) {
    if (p.team == null) continue;
    p.contract.yrs--;
    if (p.contract.yrs <= 0) {
      if (p.team === S.userTeam) { dissolveDuo(p.id); p.team = null; p.contract = { sal: salaryFor(calcCA(p), p.age, p.pot), yrs: 0 }; continue; }
      const r = roster(p.team).sort((a, b) => calcCA(b) - calcCA(a));
      const ns = salaryFor(calcCA(p), p.age, p.pot);
      if (r.indexOf(p) < 10 && R.chance(0.65 + p.hid.loy * 0.015) && p.age < 34 && teamPayroll(p.team) - p.contract.sal + ns <= team(p.team).budget * 1.05) p.contract = { sal: ns, yrs: R.int(1, 4) };
      else { p.team = null; p.contract = { sal: ns, yrs: 0 }; }
    }
  }
  const nT = S.teams.length;
  for (let i = 0; i < Math.round(nT * 1.3); i++) {
    const p = genPlayer(S, R.f(6.5, 11.5), undefined, R.int(18, 21), null, R.pick(['USA', 'USA', 'ESP', 'ITA', 'GER']));
    p.pot = Math.round(clamp(calcCA(p) + R.f(1, 6.5), 0, 20) * 10) / 10;
    p.rookie = true;
    S.players[p.id] = p;
  }
  while (freeAgents().length < nT * 1.4) { const np = genPlayer(S, R.f(6, 10.5), undefined, R.int(23, 33), null, R.pick(['USA', 'ESP', 'ITA', 'GER'])); S.players[np.id] = np; }
  for (const p of freeAgents()) { p.contract.sal = salaryFor(calcCA(p), p.age, p.pot); p.wantsOut = false; }
  freeAgents().sort((a, b) => playerValue(b) - playerValue(a)).slice(nT * 2).forEach((p) => delete S.players[p.id]);
  S.season++; S.day = 0; S.phase = 'season';
  S.leagues.forEach((l) => { l.state = 'regular'; l.po = null; l.final = []; });
  for (const t of S.teams) { t.w = t.l = t.pf = t.pa = t.streak = 0; if (t.id !== S.userTeam) t.budget = Math.round(t.budget * 1.03 * 10) / 10; }
  for (const p of Object.values(S.players)) { p.st = emptyStats(); p.pst = null; p.cond = 100; p.techs = 0; p.susp = Math.min(p.susp || 0, 1); p.morale = clamp(p.morale * 0.5 + 32, 0, 100); p._complained = false; p.form = []; if (p.inj && p.inj.days > 30) p.inj.days -= 30; else p.inj = null; }
  marketNewSeason();
  ensureRosters(true);
  for (let i = 0; freeAgents().length < 70 && i < 200; i++) { const np = genPlayer(S, R.f(6, 11), undefined, R.int(20, 32), null, R.pick(['USA', 'ESP', 'ITA', 'GER'])); S.players[np.id] = np; }
  S.teams.forEach((t) => { if (t.id !== S.userTeam) autoRotation(S, t); else cleanRotation(S, t); });
  S.schedule = buildAllSchedules();
  S.vacancies = []; S.applied = []; S.sackOffers = [];
  checkDuos();
  setBoardExpectations();
  S.board.conf = clamp(S.board.conf * 0.6 + 28, 0, 100);
  revealKnown(roster(S.userTeam));
  const lg = userLeague();
  mail('Board of Directors', `${S.season}/${String(S.season + 1).slice(2)} season objectives`, `${S.coach.name},\n\nA new ${lg.name} season begins. The board's expectation:\n\n<b>${S.board.exp.txt}</b>\n\nWage budget: <b>${fmtMoney(userTeam().budget)}</b> · Payroll: ${fmtMoney(teamPayroll(S.userTeam))}`, { type: 'board' });
  const jp = S.coach.a.jp;
  const topRook = freeAgents().filter((p) => p.rookie).sort((a, b) => (b.pot + R.gauss() * (20 - jp) * 0.12) - (a.pot + R.gauss() * (20 - jp) * 0.12)).slice(0, 3);
  if (topRook.length) mail('Chief Scout', 'Young free agents to watch', `Coach, a new class of young players has entered free agency. My picks:\n\n${topRook.map((p) => `• ${plink(p)} — ${p.pos}, age ${p.age}`).join('\n')}\n\nFind them in the Market.`, { type: 'staff' });
}

function ensureRosters(offseason) {
  for (const t of S.teams) {
    if (t.id === S.userTeam) {
      const r = roster(t.id);
      if (r.length < 8) {
        const need = 8 - r.length;
        const cheap = freeAgents().sort((a, b) => a.contract.sal - b.contract.sal || calcCA(b) - calcCA(a)).slice(0, 12).sort((a, b) => calcCA(b) - calcCA(a)).slice(0, need);
        cheap.forEach((p) => { p.team = t.id; p.contract.yrs = 1; p.contract.sal = Math.min(p.contract.sal, 0.5); });
        if (cheap.length) mail('Assistant Coach', 'Emergency signings', `Coach, we didn't have enough bodies, so the league assigned us: ${cheap.map((p) => plink(p)).join(', ')} on 1-year minimum deals.`, { type: 'staff' });
        cleanRotation(S, t);
      }
      continue;
    }
    let r = roster(t.id);
    const target = offseason ? (lgTeams(t.lg).length >= 14 ? 13 : 12) : ROSTER_MIN;
    let guard = 0;
    while (r.length < target && guard++ < 20) {
      const room = t.budget - teamPayroll(t.id);
      const need = POS.find((p) => r.filter((x) => x.pos === p).length < 2);
      let cands = freeAgents().filter((p) => p.contract.sal <= Math.max(room, 0.6));
      if (!cands.length) cands = freeAgents().sort((x, y) => x.contract.sal - y.contract.sal).slice(0, 4);
      if (!cands.length || (offseason && calcCA(cands.slice().sort((x, y) => playerValue(y) - playerValue(x))[0]) < leagueLevel(t.lg) - 2.5)) { const np = genPlayer(S, leagueLevel(t.lg) - 1.4 + R.gauss() * 0.8, need, undefined, null, league(t.lg).country); np.contract.sal = salaryFor(calcCA(np), np.age, np.pot); S.players[np.id] = np; cands = [np]; }
      const pick = cands.sort((a, b) => (playerValue(b) + (b.pos === need ? 2 : 0)) - (playerValue(a) + (a.pos === need ? 2 : 0)))[0];
      pick.team = t.id; pick.contract.yrs = R.int(1, 3); pick.rookie = false; pick.wantsOut = false;
      logSigning(pick, t, pick.contract.sal, pick.contract.yrs);
      r = roster(t.id);
    }
    while (r.length > ROSTER_MAX) {
      const worst = r.sort((a, b) => playerValue(a) - playerValue(b))[0];
      logStint(worst);
      worst.team = null; worst.contract.yrs = 0;
      r = roster(t.id);
    }
  }
}

/* ---------- Transfers ---------- */
function packageValue(players) { const v = players.map(playerValue).sort((a, b) => b - a); return v.reduce((s, x, i) => s + x * (i === 0 ? 1 : 0.45), 0); }
function moveRefusal(p, toTeamId) {
  const from = p.team != null ? team(p.team) : null, to = team(toTeamId);
  if (from && p.hid.amb >= 13 && to.prestige < from.prestige - 3) return `${pname(p)} has no interest in dropping down to the ${league(to.lg).name}.`;
  if (!from && p.hid.amb >= 13 && calcCA(p) > leagueLevel(to.lg) + 2.3) return `${pname(p)}'s agent: "He's aiming higher than the ${league(to.lg).name}."`;
  return null;
}
function tradeInterest(targetId, offerIds) {
  const tgt = S.players[targetId];
  const offer = offerIds.map((id) => S.players[id]);
  if (!offer.length) return 0;
  return packageValue(offer) / (playerValue(tgt) * (tgt.wantsOut || tgt.listed ? 0.85 : 1.1) * diffCfg().trade);
}
function tradeCheck(targetId, offerIds) {
  const tgt = S.players[targetId];
  const offer = offerIds.map((id) => S.players[id]);
  const ut = userTeam();
  const inSal = tgt.contract.sal, outSal = offer.reduce((s, p) => s + p.contract.sal, 0);
  const myCount = roster(ut.id).length - offer.length + 1;
  const theirCount = roster(tgt.team).length - 1 + offer.length;
  if (myCount > ROSTER_MAX) return { ok: false, msg: `That would put you over the ${ROSTER_MAX}-man roster limit.` };
  if (myCount < 8) return { ok: false, msg: `You need at least 8 players on your roster.` };
  if (theirCount > ROSTER_MAX) return { ok: false, msg: `They'd have too many players. Offer fewer players.` };
  if (teamPayroll(ut.id) - outSal + inSal > ut.budget && inSal > outSal) return { ok: false, msg: `This trade would put you over your wage budget (${fmtMoney(ut.budget)}).` };
  return { ok: true };
}
function proposeTrade(targetId, offerIds, duoTalked) {
  const chk = tradeCheck(targetId, offerIds);
  if (!chk.ok) return chk;
  const tgt = S.players[targetId];
  const t = team(tgt.team);
  if (S.phase === 'season' && deadlinePassed()) return { ok: false, msg: 'The trade window is closed. Trades reopen in the off-season.' };
  const refuse = moveRefusal(tgt, S.userTeam);
  if (refuse) { if (!tgt.known.includes('amb')) tgt.known.push('amb'); return { ok: false, msg: refuse }; }
  const interest = tradeInterest(targetId, offerIds);
  if (interest >= 1) {
    executeTrade(tgt.team, [targetId], offerIds, duoTalked);
    mail(`${t.nick} GM`, `Trade completed: ${pname(tgt)}`, `We have a deal. ${plink(tgt)} heads to the ${userTeam().nick}; ${offerIds.map((id) => pname(S.players[id])).join(', ')} join${offerIds.length > 1 ? '' : 's'} us.`, { type: 'transfer', read: true });
    return { ok: true, msg: `Trade accepted! ${pname(tgt)} has joined your team.` };
  }
  const txt = interest > 0.8 ? "We're close, but we need a bit more value." : interest > 0.5 ? "That's not enough for a player of his quality." : "Not interested. That offer isn't even close.";
  return { ok: false, msg: `${t.nick} GM: “${txt}”` };
}
function executeTrade(otherTeamId, incoming, outgoing, duoTalked) {
  rivalsOnTrade(otherTeamId, incoming, outgoing);
  incoming.concat(outgoing).forEach((id) => logStint(S.players[id]));
  logTrade(userTeam(), team(otherTeamId), incoming, outgoing);
  onUserTradeOut(outgoing, otherTeamId);
  incoming.forEach((id) => { S.players[id].listed = false; S.players[id].unsettled = false; });
  outgoing.forEach((id) => dissolveDuo(id, duoTalked));
  incoming.forEach((id) => { const p = S.players[id]; p.team = S.userTeam; p.morale = 65; p.wantsOut = false; });
  outgoing.forEach((id) => { S.players[id].team = otherTeamId; });
  cleanRotation(S, userTeam());
  autoRotation(S, team(otherTeamId));
  revealKnown(incoming.map((id) => S.players[id]));
}
function aiTradeOffer() {
  const mine = roster(S.userTeam).sort((a, b) => playerValue(b) - playerValue(a));
  if (mine.length < 9) return;
  const target = R.pick(mine.slice(1, 9));
  const lg = userTeam().lg;
  const others = S.teams.filter((t) => t.id !== S.userTeam && (t.lg === lg || R.chance(0.3)));
  const t = R.pick(others);
  if (!t) return;
  const tv = playerValue(target);
  let best = null, bd = 1e9;
  for (const p of roster(t.id)) { const d = Math.abs(playerValue(p) - tv * R.f(0.95, 1.15)); if (d < bd) { bd = d; best = p; } }
  if (!best || playerValue(best) < tv * 0.85) return;
  S.tradeCooldown = 10;
  mail(`${t.nick} GM`, `Trade proposal: ${pname(target)}`, `Hi ${S.coach.name},\n\nThe ${teamName(t)} (${league(t.lg).short}) would like to acquire ${plink(target)} (${target.pos}, ${target.age}).\n\nIn exchange we'd send ${plink(best)} (${best.pos}, ${best.age}, ${fmtMoney(best.contract.sal)}/yr).\n\nLet us know.`,
    { type: 'transfer', actions: [{ act: 'acceptTrade', label: 'Accept trade' }, { act: 'reject', label: 'Reject' }], trade: { team: t.id, give: [target.id], get: [best.id] } });
}
function askingSalary(p) {
  const base = salaryFor(calcCA(p), p.age, p.pot);
  const mine = p.team === S.userTeam;
  const f = (p.morale < 40 ? 1.15 : 1) * (mine ? 1.12 - p.hid.loy * 0.012 : 1) * (1 + (p.hid.amb - 10) * 0.01);
  return Math.round(base * f * 100) / 100;
}
function signFreeAgent(pid, years) {
  const p = S.players[pid];
  const ut = userTeam();
  if (p.team != null) return { ok: false, msg: 'Player is not a free agent.' };
  if (roster(ut.id).length >= ROSTER_MAX) return { ok: false, msg: `Your roster is full (${ROSTER_MAX}). Release someone first.` };
  if (userLeague().state === 'playoffs') return { ok: false, msg: 'Free agent signings are closed during the playoffs.' };
  const refuse = moveRefusal(p, ut.id);
  if (refuse) { if (!p.known.includes('amb')) p.known.push('amb'); return { ok: false, msg: refuse }; }
  const sal = askingSalary(p);
  if (teamPayroll(ut.id) + sal > ut.budget) return { ok: false, msg: `Not enough wage budget. You have ${fmtMoney(Math.max(0, ut.budget - teamPayroll(ut.id)))} available.` };
  p.team = ut.id; p.contract = { sal, yrs: years + (S.phase === 'offseason' ? 1 : 0) }; p.morale = 70; p.rookie = false;
  logSigning(p, ut, sal, years);
  if (stars(calcCA(p)) >= 5) unlock('bigfish');
  cleanRotation(S, ut);
  revealKnown([p]);
  return { ok: true, msg: `${pname(p)} signed for ${fmtMoney(sal)}/yr over ${years} year${years > 1 ? 's' : ''}.` };
}
function renewContract(pid, years) {
  const p = S.players[pid];
  const ut = userTeam();
  const sal = askingSalary(p);
  if (p.morale < 25 && p.hid.loy < 15) return { ok: false, msg: `${pname(p)} is too unhappy to discuss a new deal.` };
  if (p.hid.amb >= 15 && calcCA(p) > leagueLevel(ut.lg) + 2.5) { p.wantsOut = true; if (!p.known.includes('amb')) p.known.push('amb'); return { ok: false, msg: `${pname(p)} wants to test himself at a higher level. He won't sign.` }; }
  if (teamPayroll(ut.id) - p.contract.sal + sal > ut.budget && sal > p.contract.sal) return { ok: false, msg: `A ${fmtMoney(sal)}/yr deal would take you over budget.` };
  p.contract = { sal, yrs: years + 1 };
  p.morale = clamp(p.morale + 10, 0, 100);
  return { ok: true, msg: `${pname(p)} signed a new ${years}-year deal at ${fmtMoney(sal)}/yr.` };
}
function releasePlayer(pid) {
  const p = S.players[pid];
  if (roster(S.userTeam).length <= 8) return { ok: false, msg: 'You need at least 8 players.' };
  logStint(p);
  dissolveDuo(p.id);
  p.listed = false; p.unsettled = false; S.interest = (S.interest || []).filter((i) => i.pid !== p.id);
  p.team = null; p.contract.yrs = 0;
  cleanRotation(S, userTeam());
  return { ok: true, msg: `${pname(p)} has been released.` };
}

/* ---------- Full-time talk ---------- */
function fullTimeTalk(tone) {
  const r = S.lastResult;
  if (!r || r.talked) return [];
  r.talked = true;
  const us = r.h === S.userTeam;
  const diff = us ? r.hs - r.as : r.as - r.hs;
  const fav = teamStrength(S.userTeam) - teamStrength(us ? r.a : r.h);
  const ctx = { diff, fav, late: true, pre: false, imp: 0 };
  const out = [];
  for (const p of roster(S.userTeam)) {
    if (!r.box[p.id]) continue;
    let b = toneBase(tone, ctx, p);
    if (b > 0) b += (S.coach.a.mot - 10) * 0.025; else b *= 1.2 - S.coach.a.man / 40;
    const d = clamp((b + R.gauss() * 0.15) * (0.5 + p.hid.coach / 22), -0.8, 0.8);
    p.morale = clamp(p.morale + d * 14, 0, 100);
    const [label, cls] = reactionLabel(tone, d, ctx, p);
    out.push({ p, d, label, cls });
  }
  save();
  return out.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
}

/* ---------- Mail actions ---------- */
function mailAction(mid, act) {
  const m = S.inbox.find((x) => x.id === mid);
  if (!m || m.done) return { msg: 'Already handled.' };
  const p = m.pid ? S.players[m.pid] : null;
  let msg = '';
  if (act === 'promise' && p) { p.morale = clamp(p.morale + 18, 0, 100); S.promises[p.id] = 5; msg = `You promised ${pname(p)} more minutes. Make sure he gets 20+ minutes within the next 5 games.`; }
  else if (act === 'earn' && p) { p.morale = clamp(p.morale - 8, 0, 100); if (p.hid.prof >= 13 || p.a.wrk >= 14) { p.morale += 12; msg = `${pname(p)} accepts the challenge and vows to work harder.`; } else msg = `${pname(p)} is not happy with your response.`; }
  else if (act === 'acceptTrade') {
    const tr = m.trade;
    const valid = tr.give.every((id) => S.players[id]?.team === S.userTeam) && tr.get.every((id) => S.players[id]?.team === tr.team);
    if (!valid) msg = 'This offer is no longer valid.';
    else if (roster(tr.team).length - tr.get.length + tr.give.length > ROSTER_MAX) msg = 'They no longer have roster space.';
    else if (roster(S.userTeam).length - tr.give.length + tr.get.length < 8) msg = 'You need at least 8 players.';
    else if (userLeague().state === 'playoffs') msg = 'Trades are closed.';
    else { executeTrade(tr.team, tr.get, tr.give, m.duoTalked); msg = 'Trade completed!'; }
  } else if (act === 'acceptJob') {
    if (S.phase === 'season') msg = 'You can only switch clubs in the off-season.';
    else { m.done = `You took the ${teamName(team(m.job))} job.`; takeNewJob(m.job); return { msg: m.done, job: true }; }
  } else if (act === 'hireStaff') msg = hireStaff(m.staffId);
  else if (act === 'retireNum') msg = retireNumber(m.retire);
  else if (['letTalk', 'promiseMove', 'notForSale', 'acceptReq', 'rejectReq'].includes(act)) msg = marketMailAction(m, act);
  else if (act === 'reject') { msg = 'Declined.'; if (m.trade) onOfferRejected(m); }
  else if (act === 'renew') return { renew: m.pid };
  m.done = msg || true;
  save();
  return { msg };
}

/* ---------- Save / load ---------- */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { console.warn('save failed', e); } }
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) { const o = JSON.parse(s); if (o.v >= 2) { S = migrateSave(o); save(); return true; } } } catch (e) { console.warn(e); }
  return false;
}
function sanitizeSave(o) {
  o.coach.name = clean(o.coach.name, 28);
  for (const l of o.leagues) { l.name = clean(l.name); l.short = clean(l.short, 6); }
  for (const t of o.teams) { t.city = clean(t.city, 24); t.nick = clean(t.nick, 24); t.abbr = clean(t.abbr, 4); if (!/^#[0-9a-f]{6}$/i.test(t.c1)) t.c1 = '#1f6feb'; if (!/^#[0-9a-f]{6}$/i.test(t.c2)) t.c2 = '#ffffff'; }
  for (const p of Object.values(o.players)) { p.first = clean(p.first, 20); p.last = clean(p.last, 24); }
  for (const m of o.inbox || []) { m.from = clean(m.from); m.subject = clean(m.subject, 80); m.body = String(m.body || '').replace(/<(?!\/?(b|i)>|br>)[^>]*>/gi, ''); }
  for (const h of o.history || []) { h.champName = clean(h.champName, 60); h.mvp = clean(h.mvp, 50); }
  for (const h of o.coach.hist || []) { h.club = clean(h.club, 60); h.lg = clean(h.lg, 8); }
  for (const st of o.staff || []) { st.first = clean(st.first, 20); st.last = clean(st.last, 24); }
  for (const p of Object.values(o.players)) for (const c of p.career || []) { c.club = clean(c.club, 60); c.t = clean(c.t, 4); }
  return o;
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function deleteSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; }

</script>
<script>
/* Courtside Manager — transfer list, "Wanted" interest, ambition, rumour mill, hot seat, deals log */
'use strict';

const INTEREST_LVL = { 1: ['Monitoring', 'i1'], 2: ['Interested', 'i2'], 3: ['Keen', 'i3'] };

function aiCoach(t) {
  const c = league(t.lg).country;
  const nm = genName(NATS[c] ? c : 'USA');
  return { name: `${nm.first} ${nm.last}`, conf: R.int(52, 72), since: S.season };
}
function ensureMarket() {
  S.interest = S.interest || []; S.news = S.news || []; S.deals = S.deals || []; S.nextNid = S.nextNid || 0;
  for (const t of S.teams) if (!t.coach) t.coach = aiCoach(t);
}
function news(kind, text, extra = {}) {
  S.news.unshift({ id: ++S.nextNid, day: S.day, season: S.season, kind, text, ...extra });
  if (S.news.length > 220) S.news.length = 220;
}
const snapP = (p) => ({ pid: p.id, name: pname(p), pos: p.pos, age: p.age, st: stars(calcCA(p)), val: playerValue(p) });
function logSigning(p, t, sal, yrs) {
  S.deals.unshift({ kind: 'sign', season: S.season, day: S.day, phase: S.phase, lg: t.lg, tid: t.id, ...snapP(p), sal, yrs });
  if (S.deals.length > 250) S.deals.length = 250;
  const lvl = leagueLevel(t.lg);
  if (calcCA(p) > lvl + 1 || t.id === S.userTeam) news('sign', `${teamName(t)} sign ${pname(p)} (${p.pos}, ${p.age}) on a ${yrs}-year deal worth ${fmtMoney(sal)}/yr.`, { lg: t.lg, tid: t.id, pid: p.id });
}
function logTrade(A, B, aGets, bGets) {
  const ag = aGets.map((id) => snapP(S.players[id])), bg = bGets.map((id) => snapP(S.players[id]));
  S.deals.unshift({ kind: 'trade', season: S.season, day: S.day, lg: A.lg, lg2: B.lg, a: A.id, b: B.id, aGets: ag, bGets: bg, val: ag.concat(bg).reduce((s, x) => s + x.val, 0) });
  if (S.deals.length > 250) S.deals.length = 250;
  const names = (arr) => arr.length ? arr.map((x) => x.name).join(' & ') : 'contract relief';
  news('trade', `TRADE: ${A.nick} acquire ${names(ag)} from the ${B.nick} for ${names(bg)}.`, { lg: A.lg, tid: A.id });
}

/* ---------- Hot seat ---------- */
function coachConf(t) { return t.id === S.userTeam ? S.board.conf : (t.coach ? t.coach.conf : 60); }
function coachName(t) { return t.id === S.userTeam ? S.coach.name : (t.coach ? t.coach.name : '—'); }
function oddsFor(c) { return c < 8 ? '1/3' : c < 15 ? 'EVS' : c < 22 ? '2/1' : c < 30 ? '4/1' : c < 40 ? '8/1' : c < 50 ? '14/1' : c < 60 ? '25/1' : c < 75 ? '50/1' : '100/1'; }
function hotSeat(lid) { return S.teams.filter((t) => !lid || lid === 'ALL' || t.lg === lid).map((t) => ({ t, conf: coachConf(t) })).sort((a, b) => a.conf - b.conf); }
function weeklyHotSeat() {
  for (const lg of S.leagues) {
    if (lg.state !== 'regular') continue;
    const ts = lgTeams(lg.id);
    const exp = ts.map((t) => ({ id: t.id, s: teamStrength(t.id) })).sort((a, b) => b.s - a.s).map((x) => x.id);
    const total = gamesPerTeamLg(lg.id);
    for (const t of ts) {
      if (t.id === S.userTeam || t.w + t.l < 3) continue;
      const before = t.coach.conf;
      const d = clamp((exp.indexOf(t.id) + 1 - teamRank(t.id)) * 1.3, -6, 5) + (t.streak <= -4 ? -3 : t.streak >= 4 ? 2 : 0) + (55 - t.coach.conf) * 0.02;
      t.coach.conf = clamp(t.coach.conf + d + R.gauss(), 0, 100);
      if (before >= 25 && t.coach.conf < 25) news('hot', `PRESSURE: ${t.coach.name} is on the hot seat at ${teamName(t)} after a ${t.w}-${t.l} start.`, { lg: lg.id, tid: t.id });
      if (t.coach.conf < 10 && t.w + t.l >= total * 0.35) {
        const old = t.coach.name;
        t.coach = aiCoach(t); t.cq = clamp(t.cq + R.int(-2, 3), 4, 19);
        news('sack', `SACKED: ${teamName(t)} have fired ${old}. ${t.coach.name} takes over.`, { lg: lg.id, tid: t.id });
      }
    }
  }
  if (S.board.conf < 30 && S.hotFlag !== S.season) {
    S.hotFlag = S.season;
    news('hot', `Bookmakers have slashed the odds on ${S.coach.name} being the next coach to lose his job at ${teamName(userTeam())}.`, { lg: userTeam().lg, tid: S.userTeam });
    mail('Your Agent', "You're on the hot seat", `Coach, I won't sugar-coat it — the bookies have you among the favourites for the sack. The board needs results, fast.\n\nCheck the <b>Rumour Mill</b> in the Market to see where you stand.`, { type: 'whisper' });
  }
}

/* ---------- Transfer listings (AI) ---------- */
function weeklyAiListings() {
  for (const t of S.teams) {
    if (t.id === S.userTeam) continue;
    const r = roster(t.id);
    if (r.filter((p) => p.listed).length >= 2) continue;
    const cand = r.find((p) => p.wantsOut && !p.listed);
    if (cand) { cand.listed = true; continue; }
    if (teamPayroll(t.id) > t.budget && R.chance(0.25)) {
      const worst = r.filter((p) => !p.listed).sort((a, b) => playerValue(a) / a.contract.sal - playerValue(b) / b.contract.sal)[0];
      if (worst) worst.listed = true;
    } else if (R.chance(0.03)) { const p = R.pick(r); if (p) p.listed = true; }
  }
}

/* ---------- Interest in your players ("Wanted") ---------- */
function interestFor(pid) { return (S.interest || []).filter((i) => i.pid === pid).sort((a, b) => b.lvl - a.lvl); }
function weeklyInterest() {
  S.interest = S.interest.filter((i) => S.players[i.pid]?.team === S.userTeam && team(i.tid) && i.tid !== S.userTeam);
  const ut = userTeam();
  const mine = roster(ut.id);
  if (!mine.length) return;
  // existing interest grows or fades on its own
  S.interest = S.interest.filter((i) => {
    const p = S.players[i.pid], t = team(i.tid);

    else if (i.lvl === 1 && R.chance(0.12)) return false;
    return true;

  const tries = 4 + mine.filter((p) => p.listed).length * 3;
  for (let k = 0; k < tries; k++) {
    const t = R.chance(0.55) ? R.pick(lgTeams(ut.lg).filter((x) => x.id !== ut.id)) : R.pick(S.teams.filter((x) => x.id !== ut.id && Math.abs(x.prestige - ut.prestige) <= 7));
    if (!t) continue;
    const p = R.wpick(mine, (x) => playerValue(x) * (x.listed ? 3 : 1) * (x.wantsOut || x.unsettled ? 2 : 1) * (x.form.length && x.form.reduce((a, b) => a + b, 0) / x.form.length >= 7.2 ? 1.5 : 1));

  }

  for (const p of mine) {
    if (!p.unsettled || p.listed || (p.reqAt && p.reqAt.season === S.season && S.day - p.reqAt.day < 30)) continue;
    const best = interestFor(p.id).map((i) => team(i.tid)).sort((a, b) => b.prestige - a.prestige)[0];
    if (best && R.chance(0.25)) {
      p.reqAt = { season: S.season, day: S.day }; p.wantsTo = best.id;
      mail(pname(p), `Transfer request: wants to join ${best.nick}`, `Coach,\n\nI've thought about this a lot. The ${teamName(best)} want me and I want to play for them. I'm formally asking you to let me go.\n\nIf you block this, I don't know how I can give 100% here.`, { type: 'player', pid: p.id, req: best.id, actions: [{ act: 'acceptReq', label: 'Accept request' }, { act: 'rejectReq', label: 'Reject request' }] });

}
function ambitionTalk(p, t) {
  (p.asked = p.asked || []).push(t.id);
  if (!p.known.includes('amb')) p.known.push('amb');
  mail(pname(p), `${t.nick} want me`, `Coach, can I be honest with you? My agent says the ${teamName(t)} (${league(t.lg).name}) are serious about me. That's a club I've always dreamed of playing for.\n\nI want to know if you'll let me talk to them.`,
    { type: 'player', pid: p.id, club: t.id, actions: [{ act: 'letTalk', label: 'Let him talk to them' }, { act: 'promiseMove', label: 'Promise a move next summer' }, { act: 'notForSale', label: "He's not for sale" }] });
}

/* AI club makes an offer for one of your players */
function aiTradeOfferFor(t, target) {
  if (!t || !target || target.team !== S.userTeam) return false;
  const room = t.budget - teamPayroll(t.id);
  const tv = playerValue(target);
  if (target.listed && room >= target.contract.sal && roster(t.id).length < ROSTER_MAX && R.chance(0.5)) {
    mail(`${t.nick} GM`, `Offer for ${pname(target)}`, `Hi ${S.coach.name},\n\nWe saw ${plink(target)} is available. The ${teamName(t)} (${league(t.lg).short}) will take over his full contract (${fmtMoney(target.contract.sal)}/yr × ${target.contract.yrs}). You get the wage room.\n\nDeal?`,
      { type: 'transfer', actions: [{ act: 'acceptTrade', label: 'Accept' }, { act: 'reject', label: 'Reject' }], trade: { team: t.id, give: [target.id], get: [] } });
    return true;

  let best = null, bd = 1e9;
  for (const p of roster(t.id)) { const d = Math.abs(playerValue(p) - tv * R.f(0.9, 1.1) * (target.listed ? 0.9 : 1.05)); if (d < bd) { bd = d; best = p; } }
  if (!best || playerValue(best) < tv * 0.8) return false;
  mail(`${t.nick} GM`, `Trade proposal: ${pname(target)}`, `Hi ${S.coach.name},\n\nThe ${teamName(t)} (${league(t.lg).short}) want ${plink(target)} (${target.pos}, ${target.age}).\n\nIn exchange we'd send ${plink(best)} (${best.pos}, ${best.age}, ${fmtMoney(best.contract.sal)}/yr).`,
    { type: 'transfer', actions: [{ act: 'acceptTrade', label: 'Accept trade' }, { act: 'reject', label: 'Reject' }], trade: { team: t.id, give: [target.id], get: [best.id] } });
  return true;
}

/* ---------- AI ↔ AI trades ---------- */
function aiAiTrade(lid, quiet) {
  const ts = lgTeams(lid).filter((t) => t.id !== S.userTeam);
  if (ts.length < 2) return false;
  const A = R.pick(ts);
  const ra = roster(A.id).sort((a, b) => calcCA(b) - calcCA(a));
  const p = ra.find((x) => x.listed || x.wantsOut) || R.pick(ra.slice(0, 10));
  if (!p) return false;
  const B = R.pick(ts.filter((t) => t.id !== A.id));
  const v = playerValue(p);
  const q = roster(B.id).filter((x) => { const r = playerValue(x) / v; return r > 0.85 && r < 1.2; }).sort(() => Math.random() - 0.5)[0];
  if (!q) return false;
  if (!quiet && R.chance(0.45)) { news('rumour', `Report: ${B.nick} and ${A.nick} discussing a deal involving ${pname(p)}.`, { lg: lid, tid: B.id, pid: p.id }); return false; }
  logStint(p); logStint(q);
  p.team = B.id; q.team = A.id; p.listed = q.listed = false; p.wantsOut = q.wantsOut = false;
  autoRotation(S, A); autoRotation(S, B);
  logTrade(B, A, [p.id], [q.id]);
  return true;
}

/* ---------- Hooks called from game.js ---------- */
function marketDaily(d) {
  if (S.phase !== 'season') return;
  for (const p of roster(S.userTeam)) if (p.unsettled && p.morale > 45) p.morale = 45;
  for (const lg of S.leagues) if (lg.state === 'regular' && S.day < lastRegDay(lg.id) * 0.75 && R.chance(0.025)) aiAiTrade(lg.id);
}
function marketWeekly() {
  if (S.phase !== 'season') return;
  weeklyHotSeat(); weeklyAiListings();
  if (!deadlinePassed()) weeklyInterest();
}
function marketSeasonEnd() {
  // hot-seat driven sackings feed the summer job market
  const fired = S.teams.filter((t) => t.id !== S.userTeam && (t.coach.conf < 22 || R.chance(0.04) || ((S.rumoured || []).includes(t.id) && t.coach.conf < 45)));
  fired.forEach((t) => news('sack', `${teamName(t)} part ways with ${t.coach.name} after the season.`, { lg: t.lg, tid: t.id }));
  return fired.map((t) => t.id);
}
function marketNewSeason() {
  for (const t of S.teams) {
    if (t.id === S.userTeam) continue;
    if (S.vacancies && S.vacancies.includes(t.id)) { t.coach = aiCoach(t); news('sack', `${teamName(t)} appoint ${t.coach.name} as head coach.`, { lg: t.lg, tid: t.id }); }
    else t.coach.conf = clamp(t.coach.conf * 0.5 + 32, 0, 100);

      S.coach.pcoach = clamp((S.coach.pcoach ?? 10) - 1.5, 1, 20);

  for (let i = 0; i < 8; i++) aiAiTrade(R.pick(S.leagues).id, true);
}
// a user trade went through — reward honouring wishes
function onUserTradeOut(ids, toTeam) {
  for (const id of ids) {
    const p = S.players[id];

      if (p.wantsTo === toTeam || p.movePromise != null || p.unsettled) {
        S.coach.pcoach = clamp((S.coach.pcoach ?? 10) + 1, 1, 20);
        news('rumour', `${S.coach.name} honours ${pname(p)}'s wish — he joins the ${team(toTeam).nick}. Players around the league take note.`, { lg: team(toTeam).lg, tid: toTeam, pid: p.id });
      }

function marketMailAction(m, act) {

  if (act === 'letTalk') {
    p.listed = true; p.morale = clamp(p.morale + 6, 0, 100);
    const i = S.interest.find((x) => x.pid === p.id && x.tid === m.club); if (i) { i.lvl = 3; i.offered = false; }

  }

  }

}
// rejecting a bid can upset ambitious players
function onOfferRejected(m) {
  const t = team(m.trade.team), ut = userTeam();
  for (const id of m.trade.give) {
    const p = S.players[id];
    if (!p || p.team !== S.userTeam) continue;
    if (p.listed || p.wantsTo === t.id) { p.morale = clamp(p.morale - 12, 0, 100); p.unsettled = p.unsettled || p.hid.amb >= 14; mail(pname(p), `Why did you turn down ${t.nick}?`, `Coach, you listed me / I asked to go, and then you turned down the ${t.nick}? What's going on?`, { type: 'player', pid: p.id }); }
    else if (p.hid.amb >= 14 && t.prestige > ut.prestige + 1 && R.chance(0.6)) { p.morale = clamp(p.morale - 10, 0, 100); if (p.hid.amb >= 16) p.unsettled = true; mail(pname(p), `I heard about ${t.nick}`, `Coach, word gets around. The ${teamName(t)} made an offer for me and you said no without even asking me. That hurts.`, { type: 'player', pid: p.id }); }

<script>
/* Courtside Manager — pre-game match preview: win probability, odds, scouting, tactical tweak, upsets */
'use strict';

// Rating calibrated against the match engine: P(home win) = 1 / (1 + e^-(rH - rA))
function teamRating(tid, home) {
  const ps = roster(tid).filter((p) => !p.inj && !(p.susp > 0)).sort((a, b) => calcCA(b) - calcCA(a)).slice(0, 8);
  if (!ps.length) return 8;
  let s = 0, w = 0;
  ps.forEach((p, i) => { const wt = i < 5 ? 1.3 : 0.7; s += calcCA(p) * (0.86 + 0.14 * p.cond / 100) * (1 + 0.035 * (p.morale - 60) / 110) * wt; w += wt; });
  const f = teamForm(tid);
  return (s / w) * (home ? 1.02 : 1) + (f.w - f.n / 2) * 0.03;
}
function teamForm(tid) {
  const g = S.schedule.filter((f) => f.played && (f.h === tid || f.a === tid)).sort((a, b) => b.day - a.day).slice(0, 5);
  const res = g.map((f) => ((f.h === tid) === (f.hs > f.as) ? 'W' : 'L'));
  return { str: res.join(''), w: res.filter((x) => x === 'W').length, n: res.length };
}
const FRACS = [[0.05, '1/20'], [0.1, '1/10'], [0.125, '1/8'], [0.167, '1/6'], [0.2, '1/5'], [0.25, '1/4'], [0.286, '2/7'], [0.333, '1/3'], [0.364, '4/11'], [0.4, '2/5'], [0.444, '4/9'], [0.5, '1/2'], [0.571, '4/7'], [0.615, '8/13'], [0.667, '4/6'], [0.727, '8/11'], [0.8, '4/5'], [0.909, '10/11'], [1, 'EVS'], [1.1, '11/10'], [1.25, '5/4'], [1.375, '11/8'], [1.5, '6/4'], [1.75, '7/4'], [2, '2/1'], [2.5, '5/2'], [3, '3/1'], [3.5, '7/2'], [4, '4/1'], [5, '5/1'], [6, '6/1'], [8, '8/1'], [10, '10/1'], [14, '14/1'], [20, '20/1'], [33, '33/1']];
function oddsFrom(p) {
  const dec = Math.max(1.02, 1 / (clamp(p, 0.01, 0.99) * 1.06));
  let best = FRACS[0];
  for (const f of FRACS) if (Math.abs(f[0] - (dec - 1)) < Math.abs(best[0] - (dec - 1))) best = f;
  return { dec: dec.toFixed(2), frac: best[1] };
}

const STOPPER = (r) => r.slice(0, 8).filter((p) => !p.inj).sort((a, b) => b.a.pdef - a.a.pdef)[0];
function starterAvg(tid) {
  const t = team(tid);
  const ids = (t.rotation && t.rotation.length ? t.rotation : roster(tid).map((p) => p.id)).slice(0, 5);
  const ps = ids.map((id) => S.players[id]).filter(Boolean);
  const avg = (fn) => ps.reduce((s, p) => s + fn(p), 0) / Math.max(1, ps.length);
  return { ps, pdef: avg((p) => p.a.pdef), idef: avg((p) => (p.a.idef + p.a.blk) / 2), sta: avg((p) => p.a.sta), cond: avg((p) => p.cond), ball: avg((p) => (p.a.han + p.a.pas) / 2), reb: avg((p) => p.a.reb), thr: avg((p) => p.a.thr) };
}
function matchPreview(f) {
  const us = f.h === S.userTeam ? f.h : f.a, oppId = us === f.h ? f.a : f.h;

  const changes = [];

  // 1. hottest player
  const withForm = oppR.filter((p) => p.form.length >= 2).map((p) => ({ p, f: p.form.reduce((a, b) => a + b, 0) / p.form.length }));
  const hot = withForm.sort((a, b) => b.f - a.f)[0];
  const star = hot ? hot.p : oppR.sort((a, b) => calcCA(b) - calcCA(a))[0];
  if (star) {
    const ppg = star.st.gp ? (star.st.pts / star.st.gp).toFixed(1) : null;
    bullets.push({ ic: '🔥', html: hot ? `<b>${plink(star)}</b> #${star.num} is their hottest player — ${hot.f.toFixed(1)} average rating over his last ${star.form.length} games${ppg ? `, ${ppg} ppg` : ''}.` : `<b>${plink(star)}</b> #${star.num} is their go-to man${ppg ? ` (${ppg} ppg)` : ''}. Everything runs through him.` });
  }
  // 2. key weakness, relative to the league's starting fives
  const lg = lgTeams(opp.lg).map((t) => starterAvg(t.id));
  const L = (k) => lg.reduce((s, x) => s + x[k], 0) / lg.length;
  const o = starterAvg(oppId);
  const cands = [
    { s: (L('pdef') - o.pdef) / 1.2, txt: `Weak perimeter defense — their starters average ${o.pdef.toFixed(1)} Perimeter D (league ${L('pdef').toFixed(1)}). Let our shooters fire.`, k: 'focus', v: 'outside' },
    { s: (L('idef') - o.idef) / 1.2, txt: `Soft at the rim — rim protection of ${o.idef.toFixed(1)} vs a league average of ${L('idef').toFixed(1)}. Attack the paint.`, k: 'focus', v: 'inside' },
    { s: (L('cond') - o.cond) / 6 + (L('sta') - o.sta) / 2.5, txt: `Tired legs — their starters are at ${Math.round(o.cond)}% condition with ${o.sta.toFixed(1)} average Stamina. Push the pace and run them.`, k: 'pace', v: 'fast' },
    { s: (L('ball') - o.ball) / 1.2, txt: `Careless with the ball — weak handling and passing (${o.ball.toFixed(1)}). Pressure them into turnovers.`, k: 'intensity', v: 'high' },
    { s: (L('reb') - o.reb) / 1.3, txt: `They don't rebound — ${o.reb.toFixed(1)} Rebounding in the starting five. Crash the offensive glass.`, k: 'oreb', v: 'crash' },
  ];

  if (hh) cands.push({ s: 1.4 + (7 - hh.hid.temp) * 0.2, txt: `${plink(hh)} #${hh.num} has a short fuse${hh.techs ? ` — ${hh.techs} technical${hh.techs > 1 ? 's' : ''} this season` : ''}. Attack him early and get him into foul trouble.`, k: 'focus', v: 'inside' });
  if (ot.defense === 'zone') cands.push({ s: 1.2, txt: 'They sit in a zone, which leaves shooters open. Get the ball moving and fire from three.', k: 'focus', v: 'outside' });
  const weak = cands.sort((a, b) => b.s - a.s)[0];
  if (weak && weak.s > 0.55) { bullets.push({ ic: '🎯', html: weak.txt }); add(weak.k, weak.v); }
  else bullets.push({ ic: '🎯', html: 'No glaring weakness — a well-balanced group. Stick to what we do well.' });
  // 3. their approach and a counter
  const counters = {
    pnr: ['They run everything through the pick & roll. Switching every screen takes it away.', 'defense', 'switch'],
    iso: ['Isolation-heavy — they clear out for their star. Our best defender should shadow him, with help packing the paint.', 'help', 'paint'],
    post: ['They feed the post relentlessly. A zone will crowd their bigs.', 'defense', 'zone'],
    run: ['They want to run and gun. Slow the game down and make them play half-court.', 'pace', 'slow'],
    motion: ['Lots of ball and player movement. Aggressive defense can break up their rhythm.', 'intensity', 'high'],
  };
  let [ctxt, ck, cv] = counters[ot.system] || counters.motion;
  if (o.thr > L('thr') + 1.2) { ctxt = `A shooting team — their starters average ${o.thr.toFixed(1)} Three Point. Run them off the line.`; ck = 'help'; cv = 'perimeter'; }
  if (changes.some((c) => c.k === ck)) bullets.push({ ic: '🧠', html: ctxt });
  else { bullets.push({ ic: '🧠', html: ctxt }); add(ck, cv); }
  const stopper = star ? STOPPER(sortedRosterIds(S.userTeam).map((id) => S.players[id])) : null;
  return { pUs, pH, pA: 1 - pH, oddsH: oddsFrom(pH), oddsA: oddsFrom(1 - pH), formH: teamForm(f.h), formA: teamForm(f.a), bullets, tweak: { changes, stopper: stopper && star ? { id: stopper.id, star: star.id } : null } };
}
function sortedRosterIds(tid) { const t = team(tid); cleanRotation(S, t); return t.rotation.slice(); }
function applyTweak(pv) {

    } finally { if (prev) S = prev; }
  }
  if (o.v >= 2) { const prev = S; S = o; try { o.teams.forEach((t) => ensureNumbers(o, t)); } finally { if (prev) S = prev; } }
  if (o.v < 4) {
    const prev = S; S = o;
    try { ensureMarket(); o.v = 4; } finally { if (prev) S = prev; }
  }
  if (o.coach && !o.coach.look) o.coach.look = randomCoachLook(strSeed(o.coach.name));
  if (o.v < 5) { const prev = S; S = o; try { ensureRivals(); o.v = Math.max(o.v, 5); } finally { if (prev) S = prev; } }
  return o;
}

<script>
/* Courtside Manager — UI */
'use strict';

const UI = { view: 'title', params: {}, stack: [], sel: null, tab: {} };
const $ = (s) => document.querySelector(s);

/* ---------- Icons ---------- */
const IC = {
  inbox: '<path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 4h16v16H4z"/>',
  squad: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.9.3 5.5 2.4 5.5 5.8"/>',
  tactics: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/><circle cx="12" cy="12" r="3"/>',
  league: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/>',
  market: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',

  pause: '<path d="M8 5v14M16 5v14"/>',

  mega: '<path d="M3 10v4h4l6 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/>',
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- Scouting fog (coach Judging Ability / Potential) ---------- */
const hashN = (a, b) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
const isMine = (p) => S && p.team === S.userTeam;
function seenCA(p) { const ca = calcCA(p); if (isMine(p)) return ca; return ca + (hashN(p.id, S.season) * 2 - 1) * ((20 - effJA()) / 20) * 1.6; }
function seenPot(p) { if (isMine(p) && effJP() >= 16) return p.pot; return Math.max(seenCA(p), p.pot + (hashN(p.id, S.season + 7) * 2 - 1) * ((21 - effJP()) / 20) * 2.4); }
function attrRange(p, k) {
  const v = p.a[k];
  if (isMine(p)) return [v, v];
  const ja = effJA(), w = ja >= 16 ? 0 : ja >= 12 ? 1 : ja >= 8 ? 2 : 3;
  const off = Math.floor(hashN(p.id * 31 + k.length * 7 + k.charCodeAt(0), 3) * (w + 1));
  const lo = clamp(v - off, 1, 20);
  return [lo, clamp(lo + w, 1, 20)];
}

/* ---------- Small components ---------- */
const starsHTML = (v) => `<span class="stars"><span class="on" style="width:${(v / 5) * 100}%">★★★★★</span>★★★★★</span>`;
const tier = (v) => (v >= 16 ? 4 : v >= 11 ? 3 : v >= 6 ? 2 : 1);
const attrCell = (v) => `<span class="av t${tier(Math.round(v))}">${Math.round(v)}</span>`;
const attrRangeCell = ([lo, hi]) => lo === hi ? attrCell(lo) : `<span class="av rng t${tier((lo + hi) / 2)}">${lo}-${hi}</span>`;
const badge = (t, cls = '') => t ? `<span class="badge ${cls}" style="background:${t.c1};color:${readableOn(t.c1, t.c2)};--trim:${t.c2}">${esc(t.abbr)}</span>` : `<span class="badge fa ${cls}">FA</span>`;
const ratingPill = (r) => r == null ? '<span class="rp">–</span>' : `<span class="rp ${r >= 8 ? 'r4' : r >= 7 ? 'r3' : r >= 6 ? 'r2' : 'r1'}">${r.toFixed(1)}</span>`;
function moraleLabel(m) { return m >= 85 ? ['Superb', 'm5'] : m >= 70 ? ['Very Good', 'm4'] : m >= 55 ? ['Good', 'm3'] : m >= 40 ? ['Okay', 'm2'] : m >= 25 ? ['Poor', 'm1'] : ['Very Poor', 'm0']; }
const moraleHTML = (m, short) => { const [l, c] = moraleLabel(m); return `<span class="mor ${c}">${short ? l.replace('Very ', 'V.') : l}</span>`; };
const condHTML = (c) => `<span class="cond ${c >= 85 ? 'c3' : c >= 65 ? 'c2' : 'c1'}">${Math.round(c)}%</span>`;
const injHTML = (p) => (p.inj ? `<span class="inj" title="${esc(p.inj.name)}">+</span>` : '') + (p.susp > 0 ? `<span class="inj susp" title="Suspended ${p.susp}">S</span>` : '');
const flag = (p) => NATS[p.nat]?.flag || '';
const avg1 = (a, b) => (b ? (a / b).toFixed(1) : '0.0');
const lgFlag = (lg) => COUNTRY_FLAG[lg.country] || '';
const prestigeStars = (pr) => starsHTML(clamp(Math.round(pr / 2) / 2, 0.5, 5));

function header(title, opts = {}) {
  return `<div class="phead">${opts.back !== false && UI.stack.length ? `<button class="iconbtn" data-act="back" aria-label="Back">${icon('back')}</button>` : ''}<h1>${title}</h1>${opts.right || ''}</div>`;
}
function tabs(key, list, def) {
  const cur = UI.tab[key] || def || list[0][0];

}
const curTab = (key, def) => UI.tab[key] || def;
function tacSeg(k, cur, act = 'tactic') {

}
function leagueChips(cur, key, withAll) {
  return `<div class="chips">${withAll ? `<button class="chip ${cur === 'ALL' ? 'on' : ''}" data-act="tab" data-k="${key}" data-v="ALL">All</button>` : ''}${S.leagues.map((l) => `<button class="chip ${cur === l.id ? 'on' : ''}" data-act="tab" data-k="${key}" data-v="${l.id}">${lgFlag(l)} ${esc(l.short)}</button>`).join('')}</div>`;
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
}
function modal(html, opts = {}) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal-bg';
  el.innerHTML = `<div class="modal ${opts.tall ? 'tall' : ''}">${html}</div>`;
  if (!opts.locked) el.addEventListener('click', (e) => { if (e.target === el) closeModal(); });
  document.body.appendChild(el);
}
function closeModal() { document.querySelectorAll('.modal-bg').forEach((m) => m.remove()); }

/* ---------- Router ---------- */
const ROOTS = ['inbox', 'squad', 'tactics', 'league', 'market', 'more'];
function go(view, params = {}, opts = {}) {
  if (ROOTS.includes(view) && !opts.keep) UI.stack = [];
  else if (!opts.replace && (UI.view !== view || JSON.stringify(params) !== JSON.stringify(UI.params))) UI.stack.push({ view: UI.view, params: UI.params });
  UI.view = view; UI.params = params; UI.sel = null;
  render();
  window.scrollTo(0, 0);
}
function back() {
  const s = UI.stack.pop();
  if (s) { UI.view = s.view; UI.params = s.params; } else UI.view = 'inbox';
  render();
}
function render() {
  const inGame = S && !['title', 'newgame', 'match'].includes(UI.view);
  document.body.classList.toggle('ingame', !!inGame);
  document.body.classList.toggle('live-on', UI.view === 'match');
  if (S && userTeam()) {
    const t = userTeam();
    document.documentElement.style.setProperty('--team', t.c1);
    document.documentElement.style.setProperty('--team2', readableOn(t.c1, t.c2));
    document.documentElement.style.setProperty('--trim', t.c2);
  }
  $('#top').innerHTML = inGame ? topBar() : '';
  $('#nav').innerHTML = inGame ? navBar() : '';
  $('#main').innerHTML = (VIEWS[UI.view] || VIEWS.title)(UI.params || {});
  if (UI.view === 'match') Live.paint(true);
}
function topBar() {
  const t = userTeam(), lg = league(t.lg);
  const label = S.pending ? 'Match Day' : S.phase === 'offseason' ? 'New Season' : S.phase === 'sacked' ? 'Find Job' : 'Continue';
  const rec = lg.state === 'playoffs' ? 'Playoffs' : `${t.w}-${t.l} · ${ordinal(teamRank(t.id))}`;
  return `<div class="tb-team" data-act="go" data-v="squad">${badge(t, 'lg')}<div><div class="tb-name">${esc(teamName(t))}</div><div class="tb-sub">${S.ironman ? '<span class="imtag">IRONMAN</span> ' : ''}${fmtDate(S.season, S.day, true)} · ${esc(lg.short)} · ${rec}</div></div></div>
  <button class="continue" data-act="continue">${label} ${icon('play')}</button>`;
}
function navBar() {
  const items = [['inbox', 'Inbox'], ['squad', 'Squad'], ['tactics', 'Tactics'], ['league', 'League'], ['market', 'Market'], ['more', 'More']];
  const root = ROOTS.includes(UI.view) ? UI.view : (UI.stack[0] && UI.stack[0].view) || '';
  const u = unreadCount();
  return items.map(([k, n]) => `<button class="nb ${root === k ? 'on' : ''}" data-act="go" data-v="${k}">${icon(k)}<span>${n}</span>${k === 'inbox' && u ? `<i class="dot">${u > 9 ? '9+' : u}</i>` : ''}</button>`).join('');
}

/* ---------- Views ---------- */
const VIEWS = {};

VIEWS.title = () => `
  <div class="title-screen">
    <div class="logo">${icon('ball', 'logo-ic')}<div><div class="l1">COURTSIDE</div><div class="l2">MANAGER</div></div></div>

    <div class="menu">
      ${hasSave() ? `<button class="btn primary big" data-act="loadGame">Continue Career</button>` : ''}
      <button class="btn ${hasSave() ? '' : 'primary'} big" data-act="go" data-v="newgame">New Career</button>
      <button class="btn big" data-act="go" data-v="achievements">🏆 Achievements (${Object.keys(achStore()).length}/${ACHIEVEMENTS.length})</button>
      <label class="btn big file">Start with Custom Database<input type="file" accept=".json,application/json" data-chg="importDbNew" hidden></label>
    </div>
    <p class="fine">All players, clubs, leagues and names are fictional. Edit everything in the Database Editor.</p>
  </div>`;

let NG = null;
function ngStrength(tid) { const r = NG.db.players.filter((p) => p.team === tid).map(calcCA).sort((a, b) => b - a).slice(0, 8); return r.length ? r.reduce((s, x) => s + x, 0) / r.length : 0; }
VIEWS.newgame = () => {

  if (NG.step === 1) {

      </div>
      <h2 class="sec">Coaching style</h2>

      <h2 class="sec">Difficulty</h2>
      <div class="seg">${Object.entries(DIFFICULTY).map(([k, v]) => `<button class="${(NG.diff || 'normal') === k ? 'on' : ''}" data-act="ngSet" data-k="diff" data-v="${k}">${v.n}</button>`).join('')}</div>

/* Inbox */
VIEWS.inbox = () => {

/* Squad */
function sortedRoster(tid) { const t = team(tid); cleanRotation(S, t); return t.rotation.map((id) => S.players[id]); }
function personalityVisible(p) { return isMine(p) || p.known.length >= 2 || effJA() >= 16; }

const archIcons = (p) => archVisible(p) && p.arch && p.arch.length ? `<span class="archi">${p.arch.map((k) => `<i title="${ARCHETYPES[k].n}">${ARCHETYPES[k].ic}</i>`).join('')}</span>` : '';

  } else if (tab === 'st') {

    body = `<table class="tbl"><thead><tr>${sth('st', 'name', 'Player', 'l')}${sth('st', 'age', 'Age')}${sth('st', 'gp', 'GP')}${sth('st', 'min', 'MIN')}${sth('st', 'pts', 'PTS')}${sth('st', 'reb', 'REB')}${sth('st', 'ast', 'AST')}${sth('st', 'stl', 'STL')}${sth('st', 'blk', 'BLK')}${sth('st', 'fg', 'FG%')}${sth('st', 'tp', '3P%')}${sth('st', 'rat', 'Rat')}</tr></thead><tbody>
    ${rs.map((p) => { const s = p.st; return `<tr data-act="player" data-id="${p.id}"><td class="l nm">${esc(pname(p, true))}</td><td>${p.age}</td><td>${s.gp}</td><td>${avg1(s.min, s.gp)}</td><td class="b">${avg1(s.pts, s.gp)}</td><td>${avg1(s.reb, s.gp)}</td><td>${avg1(s.ast, s.gp)}</td><td>${avg1(s.stl, s.gp)}</td><td>${avg1(s.blk, s.gp)}</td><td>${s.fga ? Math.round((s.fgm / s.fga) * 100) : '-'}</td><td>${s.tpa ? Math.round((s.tpm / s.tpa) * 100) : '-'}</td><td>${s.gp ? ratingPill(s.rat / s.gp) : '-'}</td></tr>`; }).join('')}

/* Tactics */
// The minutes each fit player will get next game (same plan the match engine uses).
function planMins(t) {
  const list = t.rotation.map((id) => S.players[id]).filter((p) => p && !p.inj && !(p.susp > 0));
  const tg = minTargets(list, t.instr || {}), o = {};
  list.forEach((p, i) => (o[p.id] = Math.round(tg[i])));
  return o;
}
function rotationList(r, opts = {}) {
  const pm = opts.live ? null : planMins(userTeam()), setT = (p) => userTeam().instr[p.id] && userTeam().instr[p.id].min != null;
  const slotName = (i) => (i < 5 ? POS[i] : i < 10 ? 'Bench' : 'Reserve');
  const off = (p, i) => i < 5 && p.pos !== POS[i];
  return `<div class="list rot" data-dragzone="${opts.act === 'liveSubSel' ? 'live' : 'rot'}">${r.map((p, i) => `<button class="li rotrow ${UI.sel === p.id ? 'sel' : ''} ${i === 5 || i === 10 ? 'gap' : ''}" data-act="${opts.act || 'rotSel'}" data-id="${p.id}" data-drag-row="${p.id}">
    <span class="dragh" data-drag="${p.id}" aria-label="Drag to move">⋮⋮</span><span class="slot ${i < 5 ? 'st' : i < 10 ? 'bn' : 'rs'} ${off(p, i) ? 'offpos' : ''}" ${off(p, i) ? `title="${p.pos} playing ${POS[i]}"` : ''}>${off(p, i) ? '⚠ ' : ''}${slotName(i)}</span><span class="jn">${p.num ?? '–'}</span><span class="ps">${p.pos}</span>
    <span class="grow nm">${opts.live ? `<span class="mini">${playerFace(p, 26)}</span>` : ''}${injHTML(p)}${esc(pname(p, true))}</span>${opts.live ? `<span class="mins">${opts.live(p)}</span>` : starsHTML(stars(calcCA(p)))}${opts.live ? '' : condHTML(p.cond)}
    ${opts.live ? '' : `<span class="mins ${setT(p) ? 'set' : ''}" ${setT(p) ? 'title="Your minutes target"' : ''}>${pm[p.id] ? pm[p.id] + "'" : '–'}</span>`}</button>`).join('')}</div>`;
}
function tacticsPanel(tc, which) {
  const keys = which === 'off' ? ['pace', 'system', 'focus', 'oreb'] : ['defense', 'help', 'intensity'];
  return keys.map((k) => `<div class="tac"><label>${TACTIC_LABEL[k]}</label>${tacSeg(k, tc[k])}${TACTIC_DESC[tc[k]] ? `<p class="hint">${TACTIC_DESC[tc[k]]}</p>` : ''}</div>`).join('');
}
VIEWS.tactics = () => {
  const t = userTeam();
  const r = sortedRoster(t.id);
  if (!t.tactics.system) t.tactics = { ...DEFAULT_TACTICS(), ...t.tactics };
  const tc = t.tactics;
  const tab = curTab('tac', 'off');
  let body = '';
  if (tab === 'off' || tab === 'def') body = `<div class="pad"><div class="card">${tacticsPanel(tc, tab)}</div><p class="hint">Your Tactical Knowledge (${S.coach.a.tac}) affects how well systems work. ${tab === 'off' ? `Offensive Coaching: ${S.coach.a.off}.` : `Defensive Coaching: ${S.coach.a.def}.`}</p></div>`;
  else if (tab === 'roles') {
    const pm = planMins(t), fSum = r.reduce((a, p) => a + (t.instr[p.id] && t.instr[p.id].min != null && pm[p.id] != null ? t.instr[p.id].min : 0), 0);
    const nSet = r.filter((p) => t.instr[p.id] && t.instr[p.id].min != null).length;
    body = `<div class="pad"><p class="hint">Give players roles and instructions. Coachable players follow them more closely. One player can be your Defensive Stopper — he shadows the opponent's top scorer.</p>
    <p class="hint">Minutes targets are what the bench follows during games (5 players × 48' = 240' in total). Players on <b>Auto</b> share whatever your set targets leave over.${nSet ? ` You've set ${nSet} target${nSet > 1 ? 's' : ''} adding up to ${fSum}', leaving ${Math.max(0, 240 - fSum)}' for the rest.` : ''} Tired players, foul trouble and blowouts can still shift things by a few minutes.</p>${fSum > 200 && nSet < 10 ? `<p class="warn-t">⚠ Your targets use ${fSum}' of 240' — everyone else gets squeezed${fSum > 240 ? ', and your targets will be cut down to fit' : ''}.</p>` : ''}</div>
    <div class="list">${r.slice(0, 12).map((p, i) => { const ins = t.instr[p.id] || {}; const rk = ins.role || 'bal'; return `<div class="li rolecard ${i === 5 ? 'gap' : ''}">
      <div class="rc-top"><span class="ps">${p.pos}</span><b class="grow nm" data-act="player" data-id="${p.id}">${esc(pname(p, true))}</b>${starsHTML(stars(roleScore(p, rk)))}</div>
      <div class="rc-row"><select class="inp sm" data-chg="setRole" data-id="${p.id}">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === rk ? 'selected' : ''}>${v.n}${k !== 'bal' ? ` (${stars(roleScore(p, k))}★)` : ''}</option>`).join('')}</select></div>
      <div class="rc-row"><span class="muted sm grow">Minutes target</span><span class="stepper"><button data-act="setMin" data-id="${p.id}" data-d="-2">−</button><span class="minv">${ins.min != null ? ins.min + "'" : `Auto${pm[p.id] ? ` · ${pm[p.id]}'` : ''}`}</span><button data-act="setMin" data-id="${p.id}" data-d="2">+</button></span>${ins.min != null ? `<button class="chip" data-act="setMin" data-id="${p.id}" data-d="auto">Auto</button>` : ''}</div>
      <div class="rc-row"><div class="seg mini">${[[-1, 'Fewer shots'], [0, 'Normal'], [1, 'More shots']].map(([v, l]) => `<button class="${(ins.shots || 0) === v ? 'on' : ''}" data-act="setShots" data-id="${p.id}" data-v="${v}">${l}</button>`).join('')}</div>
      <button class="chip ${ins.lock ? 'on' : ''}" data-act="setLock" data-id="${p.id}">🔒 Stopper</button></div></div>`; }).join('')}</div>`;
  } else {
    body = `<div class="pad"><div class="sec-row"><h2 class="sec">Rotation</h2><button class="btn sm" data-act="autoRot">Auto-pick</button></div>
    <label class="check"><input type="checkbox" data-chg="autoRotToggle" ${S.autoRot ? 'checked' : ''}> Let my assistant pick the rotation before every game</label>
    <p class="hint">Drag ⋮⋮ to slide a player up or down, or tap two players to swap. Top 5 start; bench 6–10 get minutes; reserves don't play.</p>${(() => { const bad = r.slice(0, 5).map((p, i) => p.pos !== POS[i] ? `${esc(p.last)} (${p.pos}) at ${POS[i]}` : null).filter(Boolean); return bad.length ? `<p class="warn-t">⚠ Out of position: ${bad.join(', ')}. Auto-pick puts players in their natural positions.</p>` : ''; })()}</div>${rotationList(r)}`;
  }
  return `${header('Tactics')}${tabs('tac', [['off', 'Offense'], ['def', 'Defense'], ['roles', 'Roles'], ['rot', 'Rotation']])}${body}`;
};

/* League */
VIEWS.league = () => {

  let body = '';
  if (tab === 'table') {
    const st = standings(lg.id);
    const lead = st[0];
    const po = poQualifiers(st.length);
    const promo = promotionLeague(lg), rel = relegationLeague(lg);
    body = `<table class="tbl"><thead><tr><th>#</th><th class="l">Team</th><th>W</th><th>L</th><th>Pct</th><th>GB</th><th>Diff</th><th>Strk</th></tr></thead><tbody>
    ${st.map((t, i) => { const gp = t.w + t.l; const gb = ((lead.w - t.w) + (t.l - lead.l)) / 2; const z = promo && i < 2 ? 'zpro' : rel && i >= st.length - 2 ? 'zrel' : ''; return `<tr data-act="go" data-v="team" data-id="${t.id}" class="${t.id === S.userTeam ? 'me' : ''} ${i === po - 1 ? 'cut' : ''} ${z}"><td>${i + 1}</td><td class="l nm">${badge(t)} ${esc(t.nick)}</td><td>${t.w}</td><td>${t.l}</td><td>${gp ? (t.w / gp).toFixed(3).replace(/^0/, '') : '.000'}</td><td>${gb ? gb.toFixed(1) : '–'}</td><td class="${t.pf - t.pa >= 0 ? 'pos' : 'neg'}">${t.pf - t.pa > 0 ? '+' : ''}${t.pf - t.pa}</td><td>${t.streak ? (t.streak > 0 ? 'W' + t.streak : 'L' + -t.streak) : '–'}</td></tr>`; }).join('')}
    </tbody></table><p class="hint pad">Top ${po} make the playoffs.${promo ? ' <span class="pos">Top 2 promoted.</span>' : ''}${rel ? ' <span class="neg">Bottom 2 relegated.</span>' : ''}</p>`;
  } else if (tab === 'fix') {
    const fx = S.schedule.filter((f) => f.h === S.userTeam || f.a === S.userTeam).sort((a, b) => a.day - b.day);
    body = `<div class="list">${fx.map((f) => { const home = f.h === S.userTeam; const opp = team(home ? f.a : f.h); const us = home ? f.hs : f.as, them = home ? f.as : f.hs; return `<div class="li fx ${f.played ? '' : 'up'}"><span class="fxd">${fmtDate(S.season, f.day, true)}</span><span class="ha">${home ? 'vs' : '@'}</span>${badge(opp)}<span class="grow">${esc(opp.nick)}${f.type === 'po' ? ` <span class="tagx">PO G${f.game}</span>` : ''}</span>${f.played ? `<b class="${us > them ? 'pos' : 'neg'}">${us > them ? 'W' : 'L'} ${us}-${them}</b>` : '<span class="muted">—</span>'}</div>`; }).join('') || '<p class="empty">No fixtures.</p>'}</div>`;
  } else if (tab === 'res') {
    const days = [...new Set(S.schedule.filter((f) => f.played && f.lg === lg.id).map((f) => f.day))].sort((a, b) => b - a).slice(0, 4);
    body = days.length ? days.map((d) => `<h3 class="sec pad">${fmtDate(S.season, d)}</h3><div class="list">${S.schedule.filter((f) => f.day === d && f.played && f.lg === lg.id).map((f) => { const H = team(f.h), A = team(f.a); const pom = S.players[f.pom]; return `<div class="li res ${f.h === S.userTeam || f.a === S.userTeam ? 'me' : ''}"><span class="rt">${badge(A)} ${esc(A.abbr)}</span><b class="${f.as > f.hs ? 'w' : ''}">${f.as}</b><span class="at">@</span><b class="${f.hs > f.as ? 'w' : ''}">${f.hs}</b><span class="rt">${esc(H.abbr)} ${badge(H)}</span>${pom ? `<span class="pom" data-act="player" data-id="${pom.id}">★ ${esc(pname(pom, true))}</span>` : ''}</div>`; }).join('')}</div>`).join('') : '<p class="empty">No games played yet.</p>';
  } else if (tab === 'lead') {
    const ts = new Set(lgTeams(lg.id).map((t) => t.id));
    const maxGp = Math.max(1, ...lgTeams(lg.id).map((t) => t.w + t.l));
    const pl = Object.values(S.players).filter((p) => ts.has(p.team) && p.st.gp >= maxGp * 0.4);
    const cats = [['pts', 'Points'], ['reb', 'Rebounds'], ['ast', 'Assists'], ['stl', 'Steals'], ['blk', 'Blocks']];
    body = `<div class="pad">${cats.map(([k, n]) => `<div class="card lead"><h3>${n} per game</h3>${pl.sort((a, b) => b.st[k] / b.st.gp - a.st[k] / a.st.gp).slice(0, 5).map((p, i) => `<div class="lrow ${p.team === S.userTeam ? 'me' : ''}" data-act="player" data-id="${p.id}"><span>${i + 1}</span>${badge(team(p.team))}<span class="grow">${esc(pname(p, true))}</span><b>${avg1(p.st[k], p.st.gp)}</b></div>`).join('') || '<p class="muted">No data yet</p>'}</div>`).join('')}</div>`;
  } else if (tab === 'po') body = playoffBracket(lg);
  else if (tab === 'hist') {
    const h = S.history.filter((x) => x.lg === lg.id);
    body = h.length ? `<table class="tbl"><thead><tr><th class="l">Season</th><th class="l">Champion</th><th class="l">MVP</th></tr></thead><tbody>${h.map((x) => `<tr><td class="l">${x.season}/${String(x.season + 1).slice(2)}</td><td class="l">${esc(x.champName)}</td><td class="l">${esc(x.mvp)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">History is written at the end of each season.</p>';
  }
  return `${header(`${lgFlag(lg)} ${esc(lg.name)}`)}<div class="pad tight">${leagueChips(lg.id, 'lgSel')}</div>${tabs('league', [['table', 'Standings'], ['fix', 'My Fixtures'], ['res', 'Results'], ['lead', 'Leaders'], ['po', 'Playoffs'], ['hist', 'History']])}<div class="scrollx">${body}</div>`;
};
function playoffBracket(lg) {
  const P = lg.po;
  if (!P) return `<p class="empty">The playoffs start after the regular season. Top ${poQualifiers(lgTeams(lg.id).length)} qualify.</p>`;
  const rounds = [1, 2, 3].filter((r) => P.series.some((s) => s.round === r));
  return `<div class="pad">${P.champion ? `<div class="card champ">🏆 <b>${esc(teamName(team(P.champion)))}</b> are champions!</div>` : ''}${rounds.map((r) => `<h3 class="sec">${ROUND_NAMES[r]} <span class="muted sm">· best of ${bestOf(r)}</span></h3>${P.series.filter((s) => s.round === r).map((s) => { const A = team(s.a), B = team(s.b); const w = seriesWinner(s); return `<div class="card series ${s.a === S.userTeam || s.b === S.userTeam ? 'me' : ''}"><div class="srow ${w === s.a ? 'w' : w ? 'l' : ''}"><span class="seed">${P.seeds.indexOf(s.a) + 1}</span>${badge(A)}<span class="grow">${esc(A.nick)}</span><b>${s.wa}</b></div><div class="srow ${w === s.b ? 'w' : w ? 'l' : ''}"><span class="seed">${P.seeds.indexOf(s.b) + 1}</span>${badge(B)}<span class="grow">${esc(B.nick)}</span><b>${s.wb}</b></div></div>`; }).join('')}`).join('')}</div>`;
}

VIEWS.market = () => {

  ${pl.slice(0, 80).map((p) => `<tr data-act="player" data-id="${p.id}"><td><span class="ps">${p.pos}</span></td><td class="l nm">${injHTML(p)}${esc(pname(p, true))}${p.rookie ? ' <span class="tagx">NEW</span>' : ''}${p.listed ? ' <span class="tagx tl">LISTED</span>' : p.wantsOut ? ' <span class="tagx">OUT</span>' : ''}</td><td>${p.age}</td><td>${starsHTML(stars(cache.get(p.id).ca))}</td><td>${starsHTML(stars(cache.get(p.id).pot))}</td><td>${tab === 'fa' ? fmtMoney(askingSalary(p)) : badge(team(p.team))}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nobody matches.</td></tr>'}

VIEWS.trade = ({ id }) => {
  const tgt = S.players[id];

  UI.offer = UI.offer && UI.offer.tid === id ? UI.offer : { tid: id, ids: [] };
  const off = UI.offer.ids;
  const t = team(tgt.team);
  const interest = tradeInterest(id, off);
  const mine = sortedRoster(S.userTeam).sort((a, b) => playerValue(b) - playerValue(a));
  const inSal = tgt.contract.sal, outSal = off.reduce((s, x) => s + S.players[x].contract.sal, 0);
  return `${header('Trade Offer')}
  <div class="pad">
    <div class="card"><div class="muted sm">You receive</div>
      <div class="trow">${badge(t)}<div class="grow"><b>${esc(pname(tgt))}</b><div class="muted sm">${tgt.pos} · ${tgt.age} yrs · ${fmtMoney(tgt.contract.sal)} × ${tgt.contract.yrs}y${tgt.wantsOut ? ' · <span class="warn-t">wants out</span>' : ''}</div></div>${starsHTML(stars(seenCA(tgt)))}</div></div>

      <div class="sm muted">${off.length ? (interest >= 1 ? 'They will accept — if he agrees to come.' : interest > 0.8 ? 'Close — add a bit more value.' : 'Not enough. Add better players or younger talent.') : 'Select players to offer below.'}</div>
      <div class="sm muted">Salary in ${fmtMoney(inSal)} · out ${fmtMoney(outSal)}</div></div>
    <h3 class="sec">You give</h3></div>
  <div class="list">${mine.map((p) => `<button class="li ${off.includes(p.id) ? 'sel' : ''}" data-act="offerToggle" data-id="${p.id}"><span class="cbx">${off.includes(p.id) ? '✓' : ''}</span><span class="ps">${p.pos}</span><span class="grow nm">${esc(pname(p, true))} <span class="muted sm">${p.age}y · ${fmtMoney(p.contract.sal)}</span></span>${starsHTML(stars(calcCA(p)))}</button>`).join('')}</div>

};

/* Live match */
const SPEEDS = { 1: 4, 2: 8, 4: 16, 8: 32 }; // game seconds per real second (1× ≈ 12-minute game)
function clockAt(t) {
  if (t < 2880) { const q = Math.min(4, Math.floor(t / 720) + 1); return { q, c: Math.max(0, 720 - (t - (q - 1) * 720)) }; }
  const k = Math.floor((t - 2880) / 300); return { q: 5 + k, c: Math.max(0, 300 - (t - 2880 - k * 300)) };
}
const Live = {
  m: null, t: 0, speed: 1, paused: false, painted: -1, tab: 'feed', hlOn: true, raf: 0, last: 0, lastPaint: 0, curRate: 6, hlLabel: null,
  start(m) {
    this.react = null; this.m = m; Sound.begin(m); this.t = 0; this.speed = 1; this.paused = true; this.painted = -1; this.tab = 'feed'; this.finished = false; this.hlLabel = null;
    cancelAnimationFrame(this.raf); this.last = performance.now(); this.raf = requestAnimationFrame((ts) => this.loop(ts));
  },
  loop(ts) {
    if (!this.m || UI.view !== 'match') { this.raf = 0; Sound.stopAll(); return; }
    const dt = Math.min(0.1, Math.max(0, (ts - this.last) / 1000)); this.last = ts;
    this.raf = requestAnimationFrame((t2) => this.loop(t2));
    this.step(dt);
    if (ts - this.lastPaint > 120) { this.lastPaint = ts; this.paint(); }
  },
  nearHL() {
    const m = this.m;
    for (let i = m.events.length - 1; i >= 0; i--) {
      const e = m.events[i];
      if (e.g < this.t - 2.5) break;
      if (e.hl && e.g <= this.t + 3.5) return e;
    }
    return null;
  },
  step(dt) {
    const m = this.m;
    if (m.done && this.t >= m.gt) { if (!this.finished) this.finish(); return; }
    if (this.paused || document.querySelector('.modal-bg')) { this.curRate = 0; Sound.tick(m, this.t, this.t, true); return; }
    if (m.brk && this.t >= m.gt) { this.curRate = 0; this.breakTime(); return; }
    let rate = SPEEDS[this.speed] || 4;
    this.hlLabel = null;
    if (this.hlOn) { const e = this.nearHL(); if (e) { rate = Math.min(rate, 1.6); this.hlLabel = e.lbl || 'KEY MOMENT'; } }
    this.curRate = rate; this.baseRate = rate;
    // the court can ask the clock to ease off so players reach their spots naturally (never a teleport)
    const sl = typeof Court !== 'undefined' && Court.m === m && Court.slow != null ? Court.slow : 1;
    this.slowK = (this.slowK ?? 1) + (sl - (this.slowK ?? 1)) * Math.min(1, dt * (sl < (this.slowK ?? 1) ? 12 : 3));
    let nt = this.t + dt * rate * this.slowK;
    if (m.brk || m.done) nt = Math.min(nt, m.gt);
    const t0 = this.t; this.t = nt;
    if (!m.brk && !m.done) simUntil(m, this.t + 0.01);
    Sound.tick(m, t0, this.t, false);
  },
  // box score built only from what has been shown on the court so far (the engine runs a possession ahead)
  shownBox() {
    const m = this.m, t = this.t; if (this._bx && this._bx.t === t && this._bx.n === m.plog.length) return this._bx.b;
    const b = {}, B = (id) => b[id] || (b[id] = { min: 0, pts: 0, reb: 0, oreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0 });
    for (const P of m.plog) {
      if (P.g0 > t) break;
      const dur = Math.min(t, P.g1) - P.g0; for (const side of P.on || []) for (const id of side) B(id).min += dur;
      for (const a of P.acts || []) {
        if (a.te > t) break;
        if (a.t === 'shot') { const x = B(a.p); if (a.made || !a.foul) { x.fga++; if (a.k === 'thr') x.tpa++; } if (a.made) { x.fgm++; x.pts += a.pts; if (a.k === 'thr') x.tpm++; if (a.a != null) B(a.a).ast++; } if (a.b != null) B(a.b).blk++; }
        else if (a.t === 'ft') { const x = B(a.p); x.fta++; if (a.made) { x.ftm++; x.pts++; } }
        else if (a.t === 'reb' && !a.tr) { const x = B(a.p); x.reb++; if (a.off) x.oreb++; }
        else if (a.t === 'to') { B(a.p).tov++; if (a.st != null) B(a.st).stl++; }
      }
    }
    this._bx = { t, n: m.plog.length, b }; return b;
  },
  shownScore() {
    const m = this.m;
    for (let i = m.plog.length - 1; i >= 0; i--) {
      const P = m.plog[i]; if (P.g0 > this.t) continue;
      if (P.g1 <= this.t) return [P.hs, P.as];
      let sc = P.s0 || [0, 0];

      return sc;
    }
    return [0, 0];
  },
  visibleCount() { const m = this.m; let n = 0; for (const e of m.events) if (e.g <= this.t) n++; return n; },
  breakTime() {
    const m = this.m, q = m.brk;
    if (q === 2) { talkModal('Half-time team talk', true); return; }
    modal(`<h2>${q <= 4 ? `End of Q${q}` : 'End of regulation'}</h2>${scoreLine()}<p class="hint">Make changes or carry on.</p>
      <div class="grid3"><button class="btn" data-act="liveTac">Tactics</button><button class="btn" data-act="liveSubs">Subs</button><button class="btn" data-act="liveShout">${icon('mega')} Shout</button></div>
      <div class="row-btns"><button class="btn primary big" data-act="liveResume">Resume ${icon('play')}</button></div>`, { locked: true });
  },
  finish() {

  },
  paintLegend() {
    const m = this.m, el = $('#clegend'); if (!el || !m) return;
    const hot = [], cold = [];
    m.sides.forEach((s) => s.on.forEach((p) => { const h = s.heat[p.id] || 0; if (h > 0.45) hot.push(`${esc(s.team.abbr)} ${esc(p.last)}`); else if (h < -0.45) cold.push(`${esc(s.team.abbr)} ${esc(p.last)}`); }));
    const html = `<span class="fire">🔥 ${hot.join(', ') || '—'}</span><span class="ice">🧊 ${cold.join(', ') || '—'}</span>`;
    if (el._h !== html) { el._h = html; el.innerHTML = html; }
  },
  paintOnCourt() {
    const m = this.m, el = $('#oncourt'); if (!el || !m) return;
    const s = m.sides[m.us], P = m.plog.filter((x) => x.g0 <= this.t).pop();

    const SB = this.shownBox();
    const parts = ids.map((id) => { const p = S.players[id], en = Math.round(s.en[id] ?? 100), h = s.heat[id] || 0, r = rx[id], b = SB[id] || {};
      return { k: [id, Math.round(en / 5), h > 0.45 ? 1 : h < -0.45 ? -1 : 0, r ? r.cls : '', b.pts, m.techs[id] || 0].join(':'),
        h: `<button class="oc ${r ? r.cls : ''}" data-act="livePlayer" data-id="${id}"><span class="ocf">${playerFace(p, 40)}${r ? `<span class="remo">${REACT_EMO[r.cls] || ''}</span>` : h > 0.45 ? '<span class="remo">🔥</span>' : h < -0.45 ? '<span class="remo">🧊</span>' : ''}</span><span class="ocn">${p.num ?? ''} ${esc(p.last)}</span><span class="ocs">${b.pts || 0} pts${m.techs[id] ? ' · T' : ''}</span><span class="en"><i style="width:${en}%;background:${en > 70 ? '#4cc38a' : en > 50 ? '#e8b94a' : '#f06a6a'}"></i></span>${r ? `<span class="ocr ${r.cls}">${r.label}</span>` : ''}</button>` }; });

function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function readFile(input, cb) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { cb(JSON.parse(rd.result)); } catch (e) { toast('Could not read file: ' + esc(e.message), 'bad'); } input.value = ''; };
  rd.readAsText(f);
}

/* drag to reorder the rotation (rotation tab, squad overview, live subs) */
const Drag = {
  st: null,
  down(e) {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    const zone = h.closest('[data-dragzone]'); if (!zone) return;
    e.preventDefault();
    const rows = [...zone.querySelectorAll('[data-drag-row]')], row = h.closest('[data-drag-row]');
    const rects = rows.map((r) => r.getBoundingClientRect());
    this.st = { zone, rows, row, rects, from: rows.indexOf(row), to: rows.indexOf(row), y0: e.clientY, id: +row.dataset.dragRow, moved: false };
    row.classList.add('dragging'); try { h.setPointerCapture(e.pointerId); } catch (x) {}
  },
  move(e) {
    const st = this.st; if (!st) return; e.preventDefault();
    const dy = e.clientY - st.y0; if (Math.abs(dy) > 4) st.moved = true;
    st.row.style.transform = `translateY(${dy}px)`;
    const mid = st.rects[st.from].top + st.rects[st.from].height / 2 + dy;
    let to = 0; st.rects.forEach((r, i) => { if (i !== st.from && mid > r.top + r.height / 2) to = i < st.from ? i + 1 : i; });
    if (mid < st.rects[0].top + st.rects[0].height / 2) to = 0;
    st.to = to; const hgt = st.rects[st.from].height;
    st.rows.forEach((r, i) => { if (i === st.from) return; let sh = 0; if (st.from < to && i > st.from && i <= to) sh = -hgt; if (st.from > to && i >= to && i < st.from) sh = hgt; r.style.transform = sh ? `translateY(${sh}px)` : ''; });
    // auto-scroll near the edges
    const scr = document.scrollingElement; if (e.clientY < 90) scr.scrollTop -= 8; else if (e.clientY > innerHeight - 110) scr.scrollTop += 8;
  },
  up() {
    const st = this.st; if (!st) return; this.st = null;
    st.rows.forEach((r) => { r.style.transform = ''; r.classList.remove('dragging'); });
    Drag.justDragged = st.moved; setTimeout(() => (Drag.justDragged = false), 50);
    if (!st.moved || st.to === st.from) return;
    const t = userTeam(), rot = t.rotation, targetId = +st.rows[st.to].dataset.dragRow;
    const i = rot.indexOf(st.id); if (i < 0) return; rot.splice(i, 1);
    const j = rot.indexOf(targetId); rot.splice(st.from < st.to ? j + 1 : j, 0, st.id);
    S.autoRot = false; UI.sel = null; save();
    if (st.zone.dataset.dragzone === 'live' && Live.m) { rebuildPlan(S, Live.m, liveSide(), false); modalSubs(); } else render();
  },
};
document.addEventListener('pointerdown', (e) => Drag.down(e));
document.addEventListener('pointermove', (e) => Drag.move(e), { passive: false });
document.addEventListener('pointerup', () => Drag.up());
document.addEventListener('pointercancel', () => Drag.up());
document.addEventListener('click', (e) => {
  if (Drag.justDragged || e.target.closest('[data-drag]')) { e.preventDefault(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) {
    e.preventDefault();
    if (typeof Music !== 'undefined') { const a = el.dataset.act; Music.click(el.classList.contains('primary') || a === 'continue' ? 'primary' : a === 'back' || a === 'closeModal' ? 'back' : a === 'tab' || a === 'go' || a === 'nav' ? 'tab' : 'tap'); }
    fn(el.dataset, el);
  }
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.chg === 'ngName') CHG.ngName(el); });

function historyTable(rows, awards = []) {
  if (!rows.length) return '<p class="empty">No career history yet.</p>';
  const aw = (r) => awards.filter((a) => a.s === r.s && (!a.lg || a.lg === r.lg)).map((a) => `<span class="aw" title="${a.k}">${a.k === 'MVP' ? 'MVP' : '🏆'}</span>`).join('');
  const tot = rows.reduce((t, r) => { for (const k of ['gp', 'gs', 'min', 'pts', 'reb', 'ast', 'rat', 'pgp']) t[k] += r[k] || 0; return t; }, { gp: 0, gs: 0, min: 0, pts: 0, reb: 0, ast: 0, rat: 0, pgp: 0 });
  const line = (r, cls = '') => `<tr class="${cls}"><td class="l">${r.live ? '<b>' : ''}${r.s}/${String(r.s + 1).slice(2)}${r.live ? '*</b>' : ''}</td>
    <td class="l nm"><span class="badge" style="background:${r.c1};color:${r.c2}">${esc(r.t)}</span> ${esc(r.club)} ${aw(r)}</td><td>${esc(r.lg)}</td>
    <td>${r.gp}${r.pgp ? ` <span class="muted">(${r.pgp})</span>` : ''}</td><td>${avg1(r.min, r.gp)}</td><td class="b">${avg1(r.pts, r.gp)}</td><td>${avg1(r.reb, r.gp)}</td><td>${avg1(r.ast, r.gp)}</td><td>${r.gp ? ratingPill(r.rat / r.gp) : '-'}</td></tr>`;
  return `<table class="tbl hist"><thead><tr><th class="l">Season</th><th class="l">Club</th><th>Lg</th><th>Apps</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>Av Rat</th></tr></thead><tbody>
    ${rows.slice().reverse().map((r) => line(r)).join('')}
    <tr class="tot"><td class="l" colspan="3"><b>Career</b> · ${new Set(rows.map((r) => r.s)).size} seasons</td><td><b>${tot.gp}</b>${tot.pgp ? ` <span class="muted">(${tot.pgp})</span>` : ''}</td><td>${avg1(tot.min, tot.gp)}</td><td class="b">${avg1(tot.pts, tot.gp)}</td><td>${avg1(tot.reb, tot.gp)}</td><td>${avg1(tot.ast, tot.gp)}</td><td>${tot.gp ? ratingPill(tot.rat / tot.gp) : '-'}</td></tr>
  </tbody></table><p class="hint pad">Apps = regular-season games (playoff games in brackets). * = current season.</p>`;
}
function duoTalk(goingId, ctx, mailId) {
  const going = S.players[goingId], partner = S.players[duoPartner(goingId)];
  const h = partner.hid;
  const quote = h.temp <= 6 ? `Are you serious? ${going.first} is the reason I'm playing like this. You move him and you'll regret it.`
    : h.loy >= 15 ? `Coach, I've given everything to this club. ${going.first} and I have something special. Please tell me the rumours aren't true.`
    : h.ego >= 15 ? `Look, I'll still get mine. But ${going.first} makes my life easy out there. Think about what you're doing.`
    : `Coach, can we talk? I heard you might move ${going.first}. He's my guy — we just click. Are you really doing this?`;
  modal(`<div class="talk-head"><span class="mfrom-face">${playerFace(partner, 48)}</span><div><b>${esc(pname(partner))}</b><div class="muted sm">⚡ Dynamic Duo with ${esc(pname(going))} · ${personalityVisible(partner) ? esc(personality(partner)) : ''}</div></div></div>
    <p class="quote">“${esc(quote)}”</p>
    <div class="tones one">
      <button class="tone t-demand" data-act="duoAnswer" data-a="business" data-g="${goingId}" data-ctx="${ctx}" data-mail="${mailId || ''}"><b>"It's a business decision."</b><span>Go ahead with the trade. He won't like it.</span></button>
      <button class="tone t-encourage" data-act="duoAnswer" data-a="explain" data-g="${goingId}" data-ctx="${ctx}" data-mail="${mailId || ''}"><b>"I'll find you a new running mate."</b><span>Go ahead and try to talk him round (Man Management ${S.coach.a.man}).</span></button>
      <button class="tone t-praise" data-act="duoAnswer" data-a="cancel" data-g="${goingId}" data-ctx="${ctx}" data-mail="${mailId || ''}"><b>"You're right. The deal is off."</b><span>Call off the trade. Earns respect in the locker room.</span></button>
    </div>`, { locked: true, tall: true });
}
function staffBio(st) {
  const club = st.team != null ? teamName(team(st.team)) : null;
  const out = [`${st.first} ${st.last} (${st.age}) ${club ? `is the ${STAFF_ROLES[st.role].n} at ${club}` : `is a ${STAFF_ROLES[st.role].n} currently without a club`}.`];
  const best = STAFF_ATTRS.slice().sort((a, b) => st.a[b.k] - st.a[a.k])[0];
  out.push(`His strongest quality is ${best.n.toLowerCase()} (${st.a[best.k]}).`);
  if (st.ex) {
    const e = st.ex;
    out.push(`A former ${POS_NAME[e.pos].toLowerCase()}, he played ${e.seasons} season${e.seasons === 1 ? '' : 's'} for ${joinList(e.clubs.slice(-4))}${e.gp ? ` — ${e.gp} games, ${(e.pts / e.gp).toFixed(1)} points per game, average rating ${(e.rat / e.gp).toFixed(2)}` : ''}.`);
    const t = e.awards.filter((a) => a.k === 'Champion').length, mv = e.awards.filter((a) => a.k === 'MVP').length;
    if (t || mv) out.push(`Won ${[t ? `${t} title${t > 1 ? 's' : ''}` : '', mv ? `${mv} MVP award${mv > 1 ? 's' : ''}` : ''].filter(Boolean).join(' and ')} as a player.`);
  }
  return out.join(' ');
}
