:root {
  --bg: #14110f; --panel: #1d1916; --panel2: #27211d; --line: #382f28; --text: #f3ece2; --muted: #a0948a;
  --brand: #ff6b1a; --brand2: #ffb066; --wood: #c98c4f; --ink: #14110f;
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --team: #1f6feb; --team2: #fff; --pos: #4cc38a; --neg: #f06a6a; --warn: #e3b341; --gold: #f2c94c;
  --t1: #e5534b; --t2: #d9a62e; --t3: #8fd16a; --t4: #34d0a8;
  --top-h: 64px; --nav-h: 62px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
body { min-height: 100vh; overscroll-behavior-y: none; }
body.ingame main { padding-top: calc(var(--top-h) + env(safe-area-inset-top)); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
main { max-width: 760px; margin: 0 auto; }
a { color: var(--brand2); text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.nb .ic, .iconbtn .ic, .phead .ic { width: 20px; height: 20px; vertical-align: middle; }
.flag { width: 1.4em; height: .93em; border-radius: 2px; vertical-align: -.08em; box-shadow: 0 0 0 1px rgba(0,0,0,.35); flex: none; }
.flagc { font-size: 10px; font-weight: 700; padding: 0 3px; border: 1px solid var(--line); border-radius: 3px; }

/* Top bar */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: none; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; height: calc(var(--top-h) + env(safe-area-inset-top));
  background: linear-gradient(180deg, color-mix(in srgb, var(--team) 38%, #14110f) 0%, #1a1613 100%); border-bottom: 2px solid var(--team); }
body.ingame .topbar { display: flex; }
.tb-team { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
.tb-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { font-size: 12px; color: #d6cbbf; white-space: nowrap; }
.continue { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 800; letter-spacing: .02em;
  background: var(--team); color: var(--team2); box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset, 0 4px 14px rgba(0,0,0,.35); white-space: nowrap; }
.continue .ic { width: 16px; height: 16px; fill: currentColor; }
.continue:active { transform: scale(.97); }

/* Bottom nav */
.navbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: none; background: #1a1613; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
body.ingame .navbar { display: flex; }
.nb { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; position: relative; }
.nb.on { color: var(--text); }
.nb.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--team); }
.nb .dot { position: absolute; top: 6px; left: 52%; background: var(--neg); color: #fff; font-style: normal; font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; min-width: 16px; text-align: center; }

/* Page header & tabs */
.phead { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
.phead h1 { font-size: 20px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 14px; }
.tab.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--team); }

.pad { padding: 10px 12px; }
.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; font-weight: 700; }
.sec-row { display: flex; justify-content: space-between; align-items: center; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; }
.card p { margin: 6px 0; }
.card.warn { border-color: var(--neg); background: color-mix(in srgb, var(--neg) 12%, var(--panel)); }
.muted { color: var(--muted); } .sm { font-size: 12px; } .b { font-weight: 700; } .big { font-size: 17px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn-t { color: var(--warn); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
.fine { color: var(--muted); font-size: 12px; text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; }
.grow { flex: 1; min-width: 0; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tagx { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.btn .ic { width: 16px; height: 16px; }
.btn.primary { background: var(--team); color: var(--team2); border-color: transparent; }
.btn.danger { background: color-mix(in srgb, var(--neg) 18%, var(--panel2)); color: #ffb3b3; border-color: color-mix(in srgb, var(--neg) 40%, transparent); }
.btn.big { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .4; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.file { cursor: pointer; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; justify-content: space-between; }
.row-btns:has(.btn) { justify-content: flex-start; }
.lbl { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; color: var(--text); font: inherit; font-size: 16px; }
.inp:focus { outline: 2px solid var(--team); outline-offset: -1px; }
.inp.color { padding: 3px; height: 42px; }
.inp.ta { min-height: 160px; font-family: ui-monospace, monospace; font-size: 12px; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; background: none; border: 0; border-radius: 7px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--team); color: var(--team2); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--team); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: none; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--team); color: var(--team2); border-color: transparent; }
.filters .inp { margin-bottom: 8px; }
.sticky-cta { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 10px 12px; background: linear-gradient(180deg, transparent, var(--bg) 30%); z-index: 5; }
body:not(.ingame) .sticky-cta { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.sticky-cta.two-btn { display: flex; gap: 8px; }

/* Badges, stars, values */
.badge { display: inline-grid; place-items: center; min-width: 30px; height: 20px; padding: 0 4px; border-radius: 5px; font-size: 10px; font-weight: 800; letter-spacing: .03em; vertical-align: middle; box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset; flex: none; }
.badge.lg { min-width: 40px; height: 40px; border-radius: 10px; font-size: 12px; }
.badge.xl { min-width: 54px; height: 54px; border-radius: 14px; font-size: 15px; }
.badge.fa { background: #463b33; color: #d4cabf; }
.stars { position: relative; display: inline-block; color: #463b33; font-size: 12px; letter-spacing: 1px; white-space: nowrap; line-height: 1; }
.stars .on { position: absolute; left: 0; top: 0; overflow: hidden; color: var(--gold); }
.av { display: inline-block; min-width: 28px; text-align: center; font-weight: 800; border-radius: 5px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); }
.av.t4 { background: color-mix(in srgb, var(--t4) 16%, transparent); }
.rp { display: inline-block; min-width: 34px; text-align: center; font-weight: 800; border-radius: 6px; padding: 1px 4px; font-size: 12px; font-variant-numeric: tabular-nums; background: #2e2722; }
.rp.r4 { background: #1d6b4f; color: #b9f5dc; } .rp.r3 { background: #2d5a2b; color: #cdf3b5; } .rp.r2 { background: #5b4a1b; color: #f6dd96; } .rp.r1 { background: #6b2525; color: #ffc4c4; }
.mor { font-size: 12px; font-weight: 600; white-space: nowrap; }
.mor.m5, .mor.m4 { color: var(--pos); } .mor.m3 { color: #a8d672; } .mor.m2 { color: var(--warn); } .mor.m1, .mor.m0 { color: var(--neg); }
.cond { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cond.c3 { color: var(--pos); } .cond.c2 { color: var(--warn); } .cond.c1 { color: var(--neg); }
.inj { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; background: var(--neg); color: #fff; font-size: 12px; font-weight: 900; margin-right: 5px; vertical-align: -1px; }
.ps { font-size: 11px; font-weight: 800; color: var(--muted); }
span.ps { display: inline-block; min-width: 24px; }

/* Tables */
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; padding: 8px 5px; text-align: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); white-space: nowrap; }
.tbl td { padding: 9px 5px; text-align: center; border-bottom: 1px solid #28221d; white-space: nowrap; }
.tbl .l { text-align: left; }
.tbl td:first-child, .tbl th:first-child { padding-left: 12px; } .tbl td:last-child, .tbl th:last-child { padding-right: 12px; }
.tbl tr[data-act] { cursor: pointer; }
.tbl tr[data-act]:active { background: var(--panel2); }
.tbl tr.sep td { border-top: 2px solid var(--line); }
.tbl tr.me td { background: color-mix(in srgb, var(--team) 16%, transparent); }
.tbl tr.cut td { border-bottom: 2px dashed var(--team); }
.tbl .nm { max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.st-dot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--team); margin-right: 5px; vertical-align: 2px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: none; border: 0; border-bottom: 1px solid #28221d; text-align: left; width: 100%; }
.li:active { background: var(--panel2); }
.li.sel { background: color-mix(in srgb, var(--team) 20%, transparent); box-shadow: inset 3px 0 0 var(--team); }
.cbx { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 900; color: var(--team2); flex: none; }
.li.sel .cbx { background: var(--team); border-color: var(--team); }
.menu-list .li { padding: 16px 14px; font-size: 16px; }

/* Inbox */
.mail.unread .msub, .mail.unread .mfrom { font-weight: 800; color: #fff; }
.mail.unread { box-shadow: inset 3px 0 0 var(--team); }
.mfrom-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: #332b25; flex: none; }
.mfrom-ic.board { background: #5b3fa8; } .mfrom-ic.staff { background: #1f6feb; } .mfrom-ic.medical { background: #b23a3a; }
.mfrom-ic.player { background: #b8761e; } .mfrom-ic.transfer { background: #1e8a6e; } .mfrom-ic.league { background: #6b7280; }
.mrow { display: flex; justify-content: space-between; gap: 8px; }
.mfrom { font-size: 13px; color: var(--muted); }
.mdate { font-size: 11px; color: var(--muted); white-space: nowrap; }
.msub { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mailview h2 { font-size: 19px; margin: 12px 0; }
.mhead { display: flex; gap: 10px; align-items: center; }
.mbody { line-height: 1.6; color: #e0d7cc; }
.done { margin-top: 14px; padding: 10px; border-radius: 9px; background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); font-weight: 600; }

/* Player */
.phero { padding: 14px 12px 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 30%, var(--bg)), var(--bg)); border-bottom: 1px solid var(--line); }
.ph-top { display: flex; gap: 12px; align-items: center; }
.ph-name { font-size: 22px; line-height: 1.15; }
.ph-sub { font-size: 13px; color: #d0c6bb; margin-top: 3px; }
.ph-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 14px; }
.ph-stats > div { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.ph-stats > div > span:first-child { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.ph-stats .stars { font-size: 14px; }
.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.attr-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.attr-box h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.arow { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13.5px; border-bottom: 1px solid #29231e; gap: 6px; }
.arow:last-child { border-bottom: 0; }
.statline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.statline > div { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px; text-align: center; }
.statline span { display: block; font-size: 10px; color: var(--muted); font-weight: 700; }
.statline b { font-size: 16px; font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 6px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 26px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); font-weight: 800; padding: 0; }
.stepper input { width: 38px; height: 28px; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-weight: 800; font-size: 15px; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.attr-grid.edit { padding: 0; margin-top: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .attr-grid.edit { grid-template-columns: 1fr 1fr; } }
.tbl .stars { font-size: 10px; letter-spacing: 0; }

/* Tactics */
.tac { margin-bottom: 12px; }
.tac label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.rotrow { gap: 8px; padding: 10px 12px; }
.rotrow.gap { border-top: 2px solid var(--line); }
.slot { font-size: 10px; font-weight: 800; padding: 3px 0; border-radius: 5px; width: 50px; text-align: center; flex: none; text-transform: uppercase; }
.slot.st { background: var(--team); color: var(--team2); } .slot.bn { background: #332b25; color: #ddd3c8; } .slot.rs { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.rotrow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mins { width: 28px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* League */
.fx { gap: 8px; font-size: 14px; }
.fx.up { opacity: .75; }
.fxd { width: 52px; font-size: 12px; color: var(--muted); }
.ha { width: 18px; color: var(--muted); font-size: 12px; }
.res { gap: 6px; font-size: 14px; flex-wrap: wrap; }
.res.me { background: color-mix(in srgb, var(--team) 12%, transparent); }
.res .rt { width: 72px; display: flex; gap: 5px; align-items: center; font-weight: 600; }
.res .rt:nth-of-type(3) { justify-content: flex-end; }
.res b { width: 30px; text-align: center; color: var(--muted); }
.res b.w { color: var(--text); }
.res .at { color: var(--muted); font-size: 12px; }
.res .pom { flex-basis: 100%; font-size: 12px; color: var(--gold); margin-left: 2px; }
.lead .lrow, .lrow { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid #29231e; font-size: 14px; cursor: pointer; }
.lrow:last-child { border-bottom: 0; }
.lrow.me { color: #fff; font-weight: 700; }
.series .srow { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
.series .srow.l { opacity: .45; }
.series .srow.w b { color: var(--pos); }
.series.me { border-color: var(--team); }
.seed { width: 16px; font-size: 11px; color: var(--muted); }
.champ { text-align: center; font-size: 17px; border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--panel)); }
.teamcard { display: flex; gap: 12px; align-items: center; border-left: 4px solid var(--pc); }

/* Market / trade */
.trow { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.meter { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: 8px 0; border: 1px solid var(--line); }
.meter.big { height: 14px; }
.meter > div { height: 100%; background: var(--neg); border-radius: 6px; transition: width .3s; }
.meter > div.mid { background: var(--warn); } .meter > div.ok { background: var(--pos); } .meter > div.bad { background: var(--neg); }

/* Match day */
.matchup { display: flex; align-items: center; justify-content: space-between; text-align: center; }
.matchup .mt { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.matchup .vs { font-size: 22px; font-weight: 800; color: var(--muted); }
.live { padding: calc(env(safe-area-inset-top) + 8px) 0 0; min-height: 100vh; display: flex; flex-direction: column; }
.scoreboard { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 16px 14px 10px; background: linear-gradient(180deg, #0e0b09, #1a1613); border-bottom: 1px solid var(--line); }
.sbt { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 16px; }
.sbt.r { justify-content: flex-end; }
.sbs { display: flex; gap: 10px; align-items: center; font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sbs span { color: var(--muted); font-size: 24px; }
.sbq { grid-column: 1 / -1; text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.lctl { display: flex; gap: 8px; padding: 10px 12px; align-items: center; }
.lctl .seg { flex: 1; }
.feed { flex: 1; padding: 0 12px 30px; }
.ev { display: flex; gap: 10px; align-items: baseline; padding: 9px 10px; border-left: 3px solid var(--ec); background: var(--panel); margin-bottom: 4px; border-radius: 0 8px 8px 0; font-size: 14px; }
.ev:first-child { animation: evin .35s ease; }
@keyframes evin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.ev .evt { font-size: 11px; color: var(--muted); width: 54px; flex: none; font-variant-numeric: tabular-nums; }
.ev .evx { flex: 1; }
.ev .evs { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev.three .evx, .ev.run .evx { font-weight: 700; }
.ev.blk .evx, .ev.stl .evx { color: #9fd0ff; }
.ev.qend, .ev.end, .ev.info { background: var(--panel2); border-left-color: var(--gold); font-weight: 700; }
.ev.end { color: var(--gold); }
.final { text-align: center; }
.final.won { border-color: var(--pos); } .final.lost { border-color: var(--neg); }
.fs { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; }
.fs span { font-size: 12px; letter-spacing: .1em; }
.qtbl { margin: 12px auto 4px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.qtbl th, .qtbl td { padding: 3px 9px; } .qtbl th { color: var(--muted); font-size: 11px; }
.pomc { margin-top: 10px; font-size: 13px; color: var(--gold); cursor: pointer; }

/* Title */
.title-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 30px 22px calc(30px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto;
  background: radial-gradient(circle at 50% 0%, rgba(240,140,0,.18), transparent 60%); }
.logo { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.logo-ic { width: 64px; height: 64px; color: #ff6b1a; stroke-width: 1.4; }
.l1 { font-size: 34px; font-weight: 900; letter-spacing: .04em; line-height: 1; }
.l2 { font-size: 15px; font-weight: 700; letter-spacing: .5em; color: #ff6b1a; }
.tag { color: #d0c6bb; font-size: 16px; margin: 0 0 28px; }
.title-screen .menu { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
.title-screen .btn.primary { background: #ff6b1a; color: #14110f; }
.team-pick { gap: 12px; }

/* Toast & modal */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 88px); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: #2c2520; border: 1px solid var(--line); color: var(--text);
  padding: 11px 16px; border-radius: 12px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-color: var(--neg); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); width: 100%; max-width: 520px; animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); } }
.modal h2 { font-size: 19px; margin-bottom: 8px; }

@media (min-width: 700px) {
  .modal-bg { align-items: center; } .modal { border-radius: 18px; }
  .attr-grid { grid-template-columns: repeat(4, 1fr); }
  .tbl .nm { max-width: 240px; }
}
@media (max-width: 380px) {
  .tbl { font-size: 12px; } .tbl td, .tbl th { padding-left: 3px; padding-right: 3px; }
  .stars { font-size: 10px; letter-spacing: 0; }
  .continue { padding: 9px 10px; }
  .attr-grid { gap: 8px; padding: 10px; } .arow { font-size: 12.5px; }
}

/* ===== v2 ===== */
.pad.tight { padding-top: 0; padding-bottom: 6px; }
.pad.tight .chips { margin-bottom: 0; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.pick b { font-size: 15px; }
.pick span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pick.on { border-color: #ff6b1a; background: color-mix(in srgb, #ff6b1a 12%, var(--panel)); }
body.ingame .pick.on { border-color: var(--team); background: color-mix(in srgb, var(--team) 14%, var(--panel)); }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 1 30%; }
.seg.mini button { font-size: 11.5px; padding: 6px 2px; }
.inp.sm { padding: 7px 9px; font-size: 14px; }
.rolecard { flex-direction: column; align-items: stretch; gap: 8px; }
.rolecard.gap { border-top: 2px solid var(--line); }
.rc-top { display: flex; gap: 8px; align-items: center; }
.rc-top .nm { cursor: pointer; }
.rc-row { display: flex; gap: 8px; align-items: center; }
.rc-row .seg { flex: 1; }
.tagx.ok { background: color-mix(in srgb, var(--pos) 20%, transparent); color: var(--pos); }
.pers { font-size: 12px; font-weight: 700; color: #c9b8ff; margin-right: 6px; }
.notes { margin: 0; padding-left: 18px; line-height: 1.55; }
.notes li { margin-bottom: 6px; }
.hiddenbox { border-style: dashed; border-color: #6e5bb5; background: color-mix(in srgb, #6e5bb5 10%, var(--panel)); }
.attr-grid.three { grid-template-columns: 1fr; }
@media (min-width: 560px) { .attr-grid.three { grid-template-columns: 1fr 1fr 1fr; } }
.av.rng { min-width: 40px; font-size: 12.5px; }
.tbl tr.zpro td:first-child { box-shadow: inset 3px 0 0 var(--pos); }
.tbl tr.zrel td:first-child { box-shadow: inset 3px 0 0 var(--neg); }
.mail.whisper .msub { font-style: italic; }
.mfrom-ic.whisper { background: #3b3352; font-size: 18px; }
.mfrom-ic.job { background: #b8952e; }
.mailview.whisper { border-color: #6e5bb5; background: linear-gradient(180deg, color-mix(in srgb, #6e5bb5 14%, var(--panel)), var(--panel)); }
.coachcard .big { font-size: 22px; }

/* Talks & shouts */

  chance: (p) => Math.random() < p,
  gauss: () => {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();

  },
  wpick(arr, wfn) {
    let total = 0;
    const w = arr.map((x) => { const v = Math.max(0, wfn(x)); total += v; return v; });
    if (total <= 0) return R.pick(arr);
    let r = Math.random() * total;
    for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

/* ---------- Schedule ---------- */
function buildLeagueSchedule(lid, cycles, startDay) {
  const list = lgTeams(lid).map((t) => t.id);
  if (list.length % 2) list.push(null);
  const n = list.length;
  const rounds = [];
  let arr = list.slice();
  for (let r = 0; r < n - 1; r++) {
    const games = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      if (a == null || b == null) continue;
      games.push((r + i) % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(games);
    arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  const all = [];
  for (let c = 0; c < cycles; c++) {
    const order = c === 0 ? rounds : R.shuffle(rounds);
    for (const g of order) all.push(g.map(([h, a]) => (c % 2 ? [a, h] : [h, a])));
  }
  const span = cycles > 2 ? 150 : 90;
  const gap = Math.max(2, Math.floor(span / all.length));
  const fx = [];
  all.forEach((games, ri) => { for (const [h, a] of games) fx.push({ id: S.nextFx++, lg: lid, day: startDay + 3 + ri * gap, h, a, played: false, type: 'reg' }); });
  return fx;
}
function leagueCycles(lid) { const n = lgTeams(lid).length; return n >= 20 ? Math.max(1, S.cycles / 2) : S.cycles; }
function gamesPerTeamLg(lid) { return (lgTeams(lid).length - 1) * leagueCycles(lid); }
function buildAllSchedules() { return S.leagues.flatMap((l) => buildLeagueSchedule(l.id, leagueCycles(l.id), 0)); }
function lastRegDay(lid) { const d = S.schedule.filter((f) => f.type === 'reg' && f.lg === lid).map((f) => f.day); return d.length ? Math.max(...d) : 0; }
function deadlinePassed() { const lg = userLeague(); return lg.state !== 'regular' || S.day > lastRegDay(lg.id) * 0.75; }

/* ---------- Standings ---------- */
function standings(lid) {
  return lgTeams(lid).sort((a, b) => {
    const pa = a.w / Math.max(1, a.w + a.l), pb = b.w / Math.max(1, b.w + b.l);
    return pb - pa || (b.w - a.w) || ((b.pf - b.pa) - (a.pf - a.pa));
  });
}
function teamRank(id) { const t = team(id); return standings(t.lg).findIndex((x) => x.id === id) + 1; }
function poQualifiers(n) { return n >= 12 ? 8 : n >= 5 ? 4 : 2; }

function setBoardExpectations() {
  const t = userTeam(), lg = league(t.lg);
  const ts = lgTeams(lg.id).map((x) => ({ id: x.id, s: teamStrength(x.id) })).sort((a, b) => b.s - a.s);
  const r = ts.findIndex((x) => x.id === t.id) + 1, n = ts.length, q = poQualifiers(n);
  let exp;
  if (r <= 1) exp = { key: 'title', txt: 'Win the league title', target: 5 };
  else if (promotionLeague(lg) && r <= 3) exp = { key: 'promo', txt: 'Win promotion (finish top 2)', target: 4.5 };

  S.board.exp = exp;
}

/* ---------- Day advance ---------- */
function nextUserFixtureDay() { const f = S.schedule.filter((x) => !x.played && (x.h === S.userTeam || x.a === S.userTeam)); return f.length ? Math.min(...f.map((x) => x.day)) : null; }
function advance() {
  if (S.pending) return { action: 'prematch' };
  if (S.phase === 'offseason') { startNewSeason(); save(); return { action: 'newseason' }; }
  if (S.phase === 'sacked') return { action: 'sacked' };
  const startMail = S.inbox.length;
  for (let guard = 0; guard < 400; guard++) {
    const r = advanceDay();
    if (r === 'prematch') { save(); return { action: 'prematch' }; }
    if (r === 'alldone') { endSeason(); save(); return { action: 'endseason' }; }
    if (S.phase === 'sacked') { save(); return { action: 'sacked' }; }
    if (S.inbox.length > startMail) break;
  }
  save();
  return { action: 'day' };
}
function advanceDay() {
  ensureRosters();
  checkLeagues();
  if (S.leagues.every((l) => l.state === 'done')) return 'alldone';
  const unplayed = S.schedule.filter((f) => !f.played);
  if (!unplayed.length) { checkLeagues(); return S.leagues.every((l) => l.state === 'done') ? 'alldone' : 'day'; }
  const next = Math.min(...unplayed.map((f) => f.day));
  for (let d = S.day + 1; d <= next; d++) dailyTick(d);
  S.day = next;
  const today = S.schedule.filter((f) => f.day === next && !f.played);
  const playing = new Set(today.flatMap((f) => [f.h, f.a]));
  S.teams.forEach((t) => { if (playing.has(t.id) && (t.id !== S.userTeam || S.autoRot)) autoRotation(S, t); });
  const uf = today.find((f) => f.h === S.userTeam || f.a === S.userTeam);
  if (uf) { S.pending = uf.id; rivalsPregame(uf); if (S.press.pre === 'assistant') assistantPress('pre', uf); return 'prematch'; }
  simDay(today);
  return 'day';
}

function dailyTick(d) {
  const ut = S.userTeam;
  const fit = S.coach.a.fit;
  const fitCoach = userStaff('fitness');
  for (const p of Object.values(S.players)) {
    const mine = p.team === ut;
    p.cond = clamp(p.cond + 7 + p.a.sta * 0.25 + (p.hid.nfit - 10) * 0.15 + (mine ? (fit - 10) * 0.2 + (S.training === 'physical' ? 2 : 0) + (fitCoach ? (fitCoach.a.fitness - 10) * 0.15 : 0) : 0), 0, 100);
    if (p.inj && hasArch(p, 'iron') && R.chance(0.3)) p.inj.days--;
    p.morale += (62 - p.morale) * (0.012 + p.hid.prof * 0.0012);
    if (p.inj) {
      p.inj.days--;
      if (p.inj.days <= 0) {
        if (mine) mail('Physio', `${pname(p)} back in training`, `Good news coach — ${plink(p)} has recovered from his ${p.inj.name.toLowerCase()} and is available.`, { type: 'medical' });
        p.inj = null; p.cond = Math.min(p.cond, 80);
      }
    }
  }
  S.day = d;
  if (d % 7 === 0) { weeklyDevelopment(); marketWeekly(); }
  marketDaily(d);
  if (userLeague().state === 'regular') {
    if (S.tradeCooldown > 0) S.tradeCooldown--;
    else if (!deadlinePassed() && R.chance(roster(S.userTeam).some((p) => p.listed) ? 0.07 : 0.035)) aiTradeOffer();
  }
  if (R.chance(0.13)) grapevine();
}

function weeklyDevelopment() {
  const cdev = S.coach.a.dev;
  const glue = teamsWithGlue();
  for (const p of Object.values(S.players)) {
    if (p.team == null) continue;
    const ca = calcCA(p);
    if (p.age <= 25 && p.pot > ca) {
      const mine = p.team === S.userTeam;
      let g = (p.pot - ca) * 0.012 * (0.6 + p.a.wrk / 20) * (0.6 + p.hid.prof / 25) * (p.age <= 21 ? 1.4 : 1);
      g *= mine ? 0.75 + cdev / 40 : 0.75 + (team(p.team).cq || 10) / 40;
      if (mine && S.training === 'youth' && p.age <= 23) g *= 1.6;
      const mins = p.st.gp ? p.st.min / p.st.gp : 0;
      g *= 0.7 + Math.min(1, mins / 25) * 0.6;
      g *= devMult(p, glue);
      growPlayer(p, g * ATTRS.length * 0.35, mine ? S.training : 'balanced');
    }
  }
}
function growPlayer(p, total, focus) {
  const bias = (TRAINING[focus] || TRAINING.balanced).bias;
  const steps = Math.abs(total), sign = total >= 0 ? 1 : -1;
  p._frac = p._frac || {};
  for (const at of ATTRS) {
    const k = at.k;
    let share = steps / ATTRS.length * (bias[k] || 1) * R.f(0.4, 1.6);
    if (sign < 0 && ['spd', 'jmp', 'sta'].includes(k)) share *= 2.2;
    if (sign < 0 && ['iq', 'cmp', 'ldr'].includes(k)) share *= 0.2;
    const v = (p._frac[k] || 0) + share * sign;
    const whole = Math.trunc(v);
    p._frac[k] = v - whole;
    if (whole) p.a[k] = clamp(p.a[k] + whole, 1, 20);
  }
}

/* ---------- The Grapevine (hidden-attribute whispers) ---------- */
const GV_SOURCES = ['Equipment Manager', 'Team Bus Driver', 'Video Analyst', 'Strength Coach', 'Club Physio', 'Club Chef', 'Locker Room Source'];
const WHISPERS = {

  coach: { hi: ['The assistants say {p} soaks up everything in film sessions. Asks great questions.'], lo: ['{p} keeps freelancing in drills. The assistants are getting frustrated.'] },
  res: { hi: ['{p} went 1-for-12 last night and was laughing in the shower afterwards. Water off a duck\'s back.'], lo: ['{p} sat alone on the bus for an hour after his bad game. Still looked shaken the next morning.'] },
  nfit: { hi: ['The strength coach says {p}\'s recovery numbers are freakish. Body of a 22-year-old.'], lo: ['{p} was blowing hard after the first sprint drill. The fitness guys are worried about the next few years.'] },
  trash: { hi: ['{p} spent the whole scrimmage telling the second unit exactly what he was going to do. Then did it.'], lo: ['I don\'t think I\'ve ever heard {p} say a word to an opponent.'] },
  ego: { hi: ['{p} was overheard complaining he doesn\'t get enough touches.', '{p} spent twenty minutes filming himself after the last game. Twenty.'], lo: ['{p} gave up his parking spot for a rookie. Little things, but the guys notice.'] },
};
function grapevine() {
  const mine = roster(S.userTeam);
  const roll = Math.random();
  if (roll < 0.62) {
    const cands = [];
    for (const p of mine) for (const h of HIDDEN) { const k = traitKind(p, h.k); if (k && !p.known.includes(h.k) && WHISPERS[h.k][k]) cands.push([p, h.k, k]); }
    if (!cands.length) return;
    const [p, key, kind] = R.pick(cands);
    p.known.push(key);
    mail(R.pick(GV_SOURCES), `Psst… about ${p.last}`, R.pick(WHISPERS[key][kind]).replace(/\{p\}/g, plink(p)) + `\n\n<i>Coach's Notes on ${pname(p, 1)} updated.</i>`, { type: 'whisper' });
  } else if (roll < 0.8) {
    const others = Object.values(S.players).filter((p) => p.team != null && p.team !== S.userTeam && !p.wantsOut && p.hid.amb >= 14 && calcCA(p) > teamStrength(p.team) + 0.5);
    if (!others.length) return;
    const p = R.pick(others);
    p.wantsOut = true; if (!p.known.includes('amb')) p.known.push('amb');
    mail('Your Agent', `Word is ${p.last} wants out`, `Heard from a contact: ${plink(p)} (${team(p.team).abbr}, ${league(team(p.team).lg).name}) has told his club he wants a move. They might let him go cheaper than usual.\n\nYou didn't hear it from me.`, { type: 'whisper' });
  } else if (roll < 0.9) {
    const egos = mine.filter((p) => p.hid.ego >= 14).sort((a, b) => calcCA(b) - calcCA(a));
    if (egos.length >= 2) {
      const [a, b] = egos;
      a.morale = clamp(a.morale - 5, 0, 100); b.morale = clamp(b.morale - 5, 0, 100);
      [a, b].forEach((p) => { if (!p.known.includes('ego')) p.known.push('ego'); });
      mail('Locker Room Source', 'Two alphas, one ball', `Tension in the locker room. ${plink(a)} and ${plink(b)} both think they should be the first option. It got loud after practice.`, { type: 'whisper' });
    }
  } else if (S.board.conf < 40) {
    mail('Club Chef', 'Something you should know', `The board had dinner in the private room last night. Your name came up. A lot. Thought you should know.`, { type: 'whisper' });
  } else {
    const t = lgTeams(userTeam().lg).filter((x) => x.id !== S.userTeam && x.coach).sort((a, b) => a.coach.conf - b.coach.conf)[0];
    if (!t || t.coach.conf > 45 || (S.rumoured || []).includes(t.id)) return;
    mail('Your Agent', `Rumour: ${t.nick} coach on thin ice`, `People are saying the ${teamName(t)} board is losing patience with their coach. If that job opens up in the summer, it could be one to watch.`, { type: 'whisper' });
    (S.rumoured = S.rumoured || []).push(t.id);
  }
}

function simDay(fixtures) {

  S.preview = { fid: f.id, p: matchPreview(f).pUs };

function finishUserMatch(m) {
  const f = S.schedule.find((x) => x.id === m.fid);
  const res = matchResult(m);
  applyResult(f, res);
  S.pending = null; S.matchLock = null;
  S.lastResult = { fid: f.id, hs: res.hs, as: res.as, box: res.box, ratings: res.ratings, pom: res.pom, quarters: res.quarters, h: f.h, a: f.a, talked: false };
  const confBefore = S.board.conf, moraleBefore = {}; roster(S.userTeam).forEach((p) => (moraleBefore[p.id] = p.morale));
  S.lastTechs = { ...(res.techs || {}), ...(res.flags || {}) };
  userPostMatch(f, res);
  recordPairs(m); checkDuos();
  { const us = f.h === S.userTeam ? res.hs : res.as, them = f.h === S.userTeam ? res.as : res.hs; upsetSwing(f, us > them); rivalsPostMatch(m, f, res, confBefore, moraleBefore); achAfterMatch(m, us > them, us, them); }
  if (S.press.post === 'assistant') assistantPress('post', f);
  simDay(S.schedule.filter((x) => x.day === f.day && !x.played));
